<style>
  html, body { height: 100%; }
  .stage { position: fixed; inset: 0; z-index: 0; }

  .rail {
    position: fixed; left: 10px; top: 50%; transform: translateY(-50%);
    z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: var(--glass); border: 1px solid var(--border2);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-radius: 999px; padding: 8px 6px;
    box-shadow: var(--shadow-2), inset 0 1px 0 var(--glass-hi);
    transition: opacity .2s, transform .2s;
  }
  .rail.hide { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(-12px); }
  .rail button {
    width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-family: inherit; line-height: 1;
    transition: background .14s, color .14s;
  }
  .rail button:hover { background: var(--accent-dim-bg); color: var(--accent); }
  .rail .rail-sep { width: 22px; height: 1px; background: var(--border2); margin: 3px 0; }

  .top-pill {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; align-items: center; gap: 8px;
    background: var(--glass); border: 1px solid var(--border2);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-radius: 999px; padding: 6px 12px;
    box-shadow: var(--shadow-2), inset 0 1px 0 var(--glass-hi);
    max-width: min(860px, calc(100% - 32px));
    transition: opacity .2s, transform .2s;
  }
  .top-pill.hide { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-12px); }
  .top-pill .tp-name {
    font-size: 13.5px; font-weight: 700; color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 380px; cursor: default;
  }
  .top-pill .tp-id { font-size: 10.5px; color: var(--text-faint); font-family: Consolas, monospace; white-space: nowrap; }
  .top-pill a.tp-link {
    color: var(--text-faint); text-decoration: none; font-size: 11px;
    border: 1px solid var(--border2); border-radius: 999px; padding: 3px 9px;
    transition: color .14s, border-color .14s; white-space: nowrap;
  }
  .top-pill a.tp-link:hover { color: var(--accent); border-color: var(--accent); }

  .tool-strip {
    position: fixed; right: 10px; top: 50%; transform: translateY(-50%);
    z-index: 20; display: flex; flex-direction: column; gap: 3px;
    background: var(--glass); border: 1px solid var(--border2);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-radius: 999px; padding: 6px 5px;
    box-shadow: var(--shadow-2), inset 0 1px 0 var(--glass-hi);
    transition: opacity .2s, transform .2s;
  }
  .tool-strip.hide { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(12px); }
  .tool-strip button {
    width: 34px; height: 34px; border-radius: 50%;
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 13px;
    transition: background .14s, color .14s;
  }
  .tool-strip button:hover { background: var(--accent-dim-bg); color: var(--accent); }
  .tool-strip button.on { background: var(--accent-dim-bg); color: var(--accent); }
  .tool-strip .strip-sep { width: 20px; height: 1px; background: var(--border2); margin: 3px auto; }

  #floatPanel {
    position: fixed; right: 60px; top: 50%; transform: translateY(-50%);
    z-index: 19; width: 300px; height: min(580px, calc(100vh - 140px));
    background: var(--glass); border: 1px solid var(--border2);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-radius: 18px;
    box-shadow: var(--shadow-2), inset 0 1px 0 var(--glass-hi);
    display: none; flex-direction: column; overflow: hidden;
  }
  #floatPanel.open { display: flex; animation: panelIn .18s ease; }
  @keyframes panelIn {
    from { opacity: 0; transform: translateY(-50%) translateX(14px); }
    to { opacity: 1; transform: translateY(-50%) translateX(0); }
  }
  #floatPanel .rp-tabs { display: flex; gap: 4px; padding: 10px 10px 0; }
  #floatPanel .rp-tabs button {
    flex: 1; background: var(--panel2); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 2px; font-size: 12px; cursor: pointer; font-family: inherit;
    white-space: nowrap; transition: border-color .14s, color .14s, background .14s;
  }
  #floatPanel .rp-tabs button.on { background: var(--accent-dim-bg); border-color: var(--accent); color: var(--text); font-weight: 600; }
  #floatPanel .rp-page { flex: 1; overflow-y: auto; padding: 10px 12px 14px; display: none; }
  #floatPanel .rp-page.on { display: block; }
  #floatPanel .row { margin-bottom: 8px; }
  #floatPanel .rp-panel-head { display: flex; align-items: center; gap: 6px; flex: none; padding: 10px 10px 0; }
  #floatPanel .rp-panel-head .rp-tabs { flex: 1; min-width: 0; padding: 0 !important; }
  #floatPanel .rp-panel-close { flex: 0 0 32px; width: 32px; height: 32px; border: 1px solid var(--border2); border-radius: 9px; background: var(--panel2); color: var(--text-dim); font: 18px/1 inherit; cursor: pointer; }
  #floatPanel .rp-panel-close:hover { color: var(--text); border-color: var(--accent); background: var(--accent-dim-bg); }
  #floatPanel .lbl { font-size: 12px; color: var(--text-dim); margin: 10px 0 5px; }
  #floatPanel .lbl:first-child { margin-top: 0; }
  #floatPanel .kbd-tips { font-size: 12px; color: var(--text-dim); line-height: 1.9; }
  #floatPanel .kbd-tips kbd {
    background: var(--panel2); border: 1px solid var(--border2); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font-size: 11px; font-family: Consolas, monospace;
  }

  .playbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
    z-index: 20; display: flex; align-items: center; gap: 4px;
    width: auto; min-width: 0; flex-wrap: nowrap; justify-content: center;
    background: var(--glass); border: 1px solid var(--border2);
    backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-radius: 12px; padding: 4px;
    box-shadow: var(--shadow-2), inset 0 1px 0 var(--glass-hi);
    transition: opacity .2s, width .18s ease;
  }
  .playbar .playbar-controls { display:flex; align-items:center; gap:7px; width:min(700px, calc(100vw - 60px)); min-width:0; }
  .playbar.hide { opacity: 0; pointer-events: none; }
  .playbar .pb-speed { flex: none; width: 80px; }
  .playbar .pb-speed-val { flex: none; font-size: 11px; color: var(--text-dim); min-width: 26px; }

  .zoom-bar {
    position: static; z-index: auto;
    display: flex; gap: 2px; align-items: center; flex: none;
    margin-left: 2px; padding-left: 6px; border-left: 1px solid var(--border2);
  }
  .zoom-bar button {
    width: 28px; height: 28px; border-radius: 50%;
    background: transparent; border: none; color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: background .13s, color .13s;
  }
  .zoom-bar button:hover { background: var(--accent-dim-bg); color: var(--accent); }
  .zoom-bar .zoom-pct { min-width: 40px; text-align: center; font-size: 11.5px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .top-pill { display: none !important; }

  .status {
    position: fixed; left: 14px; top: 12px; z-index: 20;
    background: var(--glass); border: 1px solid var(--border2);
    backdrop-filter: blur(14px) saturate(1.35);
    -webkit-backdrop-filter: blur(14px) saturate(1.35);
    color: var(--text); padding: 6px 12px; border-radius: 999px;
    font-size: 12px; pointer-events: none; max-width: calc(100% - 130px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: var(--shadow-1), inset 0 1px 0 var(--glass-hi);
  }

  .hint {
    position: fixed; right: 62px; bottom: 16px; z-index: 18;
    color: var(--text-faint); font-size: 11px;
    pointer-events: none; text-align: right;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
  }

  #gridView {
    position: fixed; inset: 0; z-index: 40;
    background: var(--bg);
    background-image: var(--bg-glow);
    overflow-y: auto; display: none;
  }
  #gridView.open { display: block; animation: fadeIn .2s ease; }
  .grid-head {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 20px;
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--border);
  }
  .grid-head .grid-title { font-size: 16px; font-weight: 800; color: var(--accent); letter-spacing: .3px; }
  .grid-head .grid-sub { font-size: 11.5px; color: var(--text-faint); }
  .grid-head input { flex: 0 1 300px; margin-left: auto; }
  .thumb-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px; padding: 20px;
  }
  .thumb-card {
    position: relative;
    background: var(--panel-grad); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; cursor: pointer;
    transition: transform .16s, border-color .16s, box-shadow .16s;
    animation: cardIn .3s both;
    animation-delay: calc(var(--i, 0) * 12ms);
  }
  .thumb-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow-2), var(--accent-glow); }
  .thumb-card.active { border-color: var(--accent); box-shadow: var(--accent-glow); }
  .thumb-card .ph {
    aspect-ratio: 5/4; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(190px 150px at 50% 45%, rgba(255, 255, 255, .028), transparent 70%),
      var(--panel2);
    color: var(--text-faint); font-size: 11px;
  }
  .thumb-card .ph img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb-card .spin {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--border2); border-top-color: var(--accent);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thumb-card .tm { padding: 9px 11px 10px; }
  .thumb-card .tn {
    font-size: 12.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb-card.active .tn { color: var(--accent); }
  .thumb-card .ts {
    font-size: 10.5px; color: var(--text-faint); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb-card .tt {
    position: absolute; top: 9px; left: 9px;
    font-size: 10px; padding: 2.5px 9px; border-radius: 999px;
    background: rgba(0, 0, 0, .55); color: #dfe5ef;
    border: 1px solid rgba(255, 255, 255, .12);
    backdrop-filter: blur(6px);
  }
  .thumb-card .tstar {
    position: absolute; top: 7px; right: 7px;
    background: none; border: none; cursor: pointer;
    font-size: 15px; color: rgba(255, 255, 255, .45);
    padding: 3px; line-height: 1; text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
    transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), color .15s;
  }
  .thumb-card .tstar:hover { transform: scale(1.25); color: #fff; }
  .thumb-card .tstar.on { color: var(--star); }

  body.immersive .rail, body.immersive .top-pill, body.immersive .tool-strip,
  body.immersive .playbar, body.immersive .status, body.immersive .hint,
  body.immersive .zoom-bar, body.immersive #floatPanel { display: none !important; }
  .immersive-exit { display: none; }
  body.immersive .immersive-exit {
    position: fixed; top: 12px; right: 12px; z-index: 90;
    display: flex; align-items: center; justify-content: center;
    padding: 7px 11px; border: 1px solid var(--border2); border-radius: 999px;
    background: var(--glass); color: var(--text); cursor: pointer;
    opacity: .72; transition: opacity .2s;
  }
  body.immersive .immersive-exit:hover { opacity: 1; }
  .thumb-card .ph-info {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 16px 10px; min-height: 80px; gap: 6px;
  }
  .thumb-card .ph-icon { font-size: 28px; opacity: .5; }
  .thumb-card .ph-nl {
    font-size: 11px; color: var(--text-dim); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
</style>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="status" id="status">加载中…</div>

    <div class="rail" id="rail">
      <button id="railGrid" title="资源库 (G)"></button>
      <div class="rail-sep"></div>

    <div class="playbar collapsed" id="playbar" aria-label="&#x64ad;&#x653e;&#x63a7;&#x5236;">

  <div id="gridView">

<script>
(() => {
  window.addEventListener('error', e => { window.__initErr = e.message + ' @' + e.lineno; });
  const K = window.SpineKit;
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  const stage = $('#stage'), canvas = $('#cv');
  const statusEl = $('#status'), mName = $('#mName'), mId = $('#mId');
  const layerPanel = $('#layerPanel'), animChips = $('#animChips'), skinChips = $('#skinChips');
  const autoIdleChk = $('#autoIdle'), zoomRange = $('#zoom'), bgInput = $('#bg');
  const browseLink = $('#browseLink'), browseLink2 = $('#browseLink2');
  const zIn = $('#zIn'), zOut = $('#zOut'), zFit = $('#zFit'), zPct = $('#zPct');
  const btnDebug = $('#btnDebug'), btnPng = $('#btnPng');
  const rightPanel = $('#floatPanel'), partsTargetEl = $('#partsTarget');
  const gridView = $('#gridView'), rail = $('#rail'), topPill = $('#topPill'), toolStrip = $('#toolStrip');
  const embedded = new URLSearchParams(location.search).get('embed') === '1';
  const pbPlay = $('#pbPlay'), pbSpeed = $('#pbSpeed'), pbSpeedVal = $('#pbSpeedVal');
  const playbarToggle = $('#playbarToggle'), playbar = $('#playbar');
  const store = K.Store('majsoul');

  let pausedAll = false, speedAll = Number(store.get('speed', 1)) || 1;
  let stageMode = false;
  let immersive = false;
  let capturePending = null;
  const debugFlags = store.get('debugView', {});

  const status = t => { statusEl.textContent = t; };

  if (embedded) {
    document.documentElement.classList.add('arthub-embedded');
    const style = document.createElement('style');
    style.textContent = `

  // ---------- 渲染循环 ----------
  let lastFrame = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (!gl || !renderer) return;
    const delta = Math.min((now - lastFrame) / 1000, 0.25);
    lastFrame = now;
    try {
    for (const L of layers) {
      if (L.state) { if (!pausedAll) L.state.update(delta * speedAll); L.state.apply(L.skeleton); }
      updWT(L.skeleton);
      if (L.hiddenSlots.size) K.applyHiddenSlots(L.skeleton, L.hiddenSlots);
    }
    const raw = gl.gl || gl;
    const c = K.parseColor(bgInput.value, [0.09, 0.1, 0.13]);
    raw.clearColor(c[0], c[1], c[2], 1);
    raw.clear(raw.COLOR_BUFFER_BIT);
    renderer.begin();
    for (const L of layers) {
      if (L.visible) renderer.drawSkeleton(L.skeleton, false);
    }
    if (K.debugActive(debugFlags)) {
      K.applyDebugFlags(renderer, debugFlags);
      K.drawDebug(renderer, layers.filter(L => L.visible).map(L => L.skeleton));
    }
    if (highlightSlot) {
      for (const L of layers) {
        if (L.visible) K.drawSlotHighlight(renderer, L.skeleton, highlightSlot);
      }
    }
    if (selIdx >= 0 && layers[selIdx] && layers[selIdx].visible) {
      try {
        const L = layers[selIdx];
        const b = L.rawBounds;
        if (b) {
          const s = L.fitScale * globalZoom;
          const cosr = Math.cos(L.rot || 0), sinr = Math.sin(L.rot || 0);
          const ox = (groupOX + L.ox) * s;
          const oy = (groupOY + L.oy) * s;
          const pts = [[b.minX, b.minY], [b.maxX, b.minY], [b.maxX, b.maxY], [b.minX, b.maxY]].map(([x, y]) => {
            const rx = x * cosr - y * sinr, ry = x * sinr + y * cosr;
            return [ox + rx * s, oy + ry * s];
          });
          const col = { r: 0.36, g: 0.62, b: 1, a: 0.9 };
          renderer.quad(false, pts[0][0], pts[0][1], pts[1][0], pts[1][1], pts[2][0], pts[2][1], pts[3][0], pts[3][1], col);
        }
      } catch {}
    }
    renderer.end();
    if (layers.length && layers.some(layer => layer.visible) && canvas.width > 1 && canvas.height > 1 && !raw.isContextLost()) playerDrawnSeq = loadSeq;
    // 同步截取缩略图 (WebGL 需 flush 后才能 toDataURL)

      try {
        const raw2 = gl.gl || gl;

        const url = canvas.toDataURL('image/png');

          const id = capturePending;
          capturePending = null;
          ThumbStore.put('majsoul:' + id, url);
        }
      } catch {}
    }
    } catch (error) {
      if (embedded && playerFailedSeq !== loadSeq) {
        playerFailedSeq = loadSeq;
        playerReadySeq = -1;
        playerPost('error', { code: 'render-failed', message: error.message || String(error) });
      }
    }
  }

  // ---------- 变换 ----------
  function applyLayerTransform(L) {
    L.skeleton.scaleX = L.fitScale * globalZoom;
    L.skeleton.scaleY = L.fitScale * globalZoom;
    L.skeleton.rotation = L.rot || 0;
    L.skeleton.x = (groupOX + L.ox) * L.fitScale * globalZoom;
    L.skeleton.y = (groupOY + L.oy) * L.fitScale * globalZoom;
  }
  function curFit() {
    if (selIdx >= 0 && layers[selIdx]) return layers[selIdx].fitScale || 1;
    return layers.length ? (layers[0].fitScale || 1) : 1;
  }
  function applyAllTransforms() {
    for (const L of layers) applyLayerTransform(L);
    zPct.textContent = Math.round(globalZoom * 100) + '%';
    zoomRange.value = String(globalZoom);
  }

  function computeRawBounds(L, useIdlePose) {
    const sk = L.skeleton;
    sk.scaleX = 1; sk.scaleY = 1; sk.x = 0; sk.y = 0; sk.rotation = 0;
    if (useIdlePose && L.state && L.idleAnim) {
      for (let i = 0; i < 30; i++) {
        L.state.update(1 / 30);
        L.state.apply(sk);
        updWT(sk);
      }
      L.state.clearTracks();
      L.state.setAnimation(0, L.idleAnim, true);
    }
    updWT(sk);
    let b = K.measureBounds(sk);
    if (!b) {
      const off = new spine.Vector2();
      const size = new spine.Vector2();
      sk.getBounds(off, size, []);
      b = { minX: off.x, minY: off.y, maxX: off.x + size.x, maxY: off.y + size.y };
    }
    if (!isFinite(b.minX) || !isFinite(b.minY) || !isFinite(b.maxX) || !isFinite(b.maxY)) {
      b = { minX: 0, minY: 0, maxX: 0, maxY: 0 };
    }
    L.rawBounds = b;
    return b;
  }

  function refitAll() {
    if (!layers.length) return;
    const visible = layers.filter(L => L.visible);
    if (!visible.length) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const L of layers) {
      if (!L.visible) continue;
      const b = computeRawBounds(L, true);
      minX = Math.min(minX, b.minX);
      minY = Math.min(minY, b.minY);
      maxX = Math.max(maxX, b.maxX);
      maxY = Math.max(maxY, b.maxY);
    }
    const w = maxX - minX, h = maxY - minY;
    let fit = (w > 0 && h > 0) ? Math.min((canvas.width * 0.85) / w, (canvas.height * 0.85) / h) : 1;
    if (!isFinite(fit) || fit <= 0) fit = 1;
    for (const L of layers) L.fitScale = fit;
    groupOX = -(minX + w / 2);
    groupOY = -(minY + h / 2);
    applyAllTransforms();
  }

  async function loadLayerModel(entry) {
    const dir = '../' + entry.dir;
    const atlasName = entry.atlas.split('/').pop();
    const assetManager = new spine.AssetManager(gl, dir);
    const atlas = await new Promise((resolve, reject) => {
      assetManager.loadTextureAtlas(atlasName, (p, a) => resolve(a), reject);
    });
    const resp = await fetch('../' + entry.skel);
    if (!resp.ok) throw new Error(entry.label + ' skel 404');
    const isJson = /\.json$/i.test(entry.skel);
    const bytes = new Uint8Array(await resp.arrayBuffer());
    const loader = new spine.AtlasAttachmentLoader(atlas);
    const data = isJson
      ? new spine.SkeletonJson(loader).readSkeletonData(JSON.parse(new TextDecoder().decode(bytes)))
      : new spine.SkeletonBinary(loader).readSkeletonData(bytes);
    const skeleton = new spine.Skeleton(data);
    skeleton.setToSetupPose();
    const stateData = new spine.AnimationStateData(data);
    stateData.defaultMix = 0.15;
    const state = new spine.AnimationState(stateData);
    const idleAnim = animMatch(data, /idle|stand|dai|wait/i) || (data.animations.length ? data.animations[0].name : null);
    if (idleAnim) state.setAnimation(0, idleAnim, true);
    return { entry, skeleton, data, state, atlas, fitScale: 1, ox: 0, oy: 0, rot: 0, opacity: 1, visible: true, idleAnim, hiddenSlots: new Set(), rawBounds: null };
  }

  function disposeLayer(L) {
    try {
      if (L.atlas) for (const p of L.atlas.pages) if (p && p.texture && p.texture.dispose) p.texture.dispose();
    } catch {}
  }

  function persistHidden() {
    if (!curEntry) return;
    const hm = store.get('hiddenMap', {});
    const cur = {};
    let any = false;
    for (const L of layers) {
      if (L.hiddenSlots.size) { cur[L.entry.id] = [...L.hiddenSlots]; any = true; }
    }
    if (any) hm[curEntry.id] = cur;
    else delete hm[curEntry.id];
    const keys = Object.keys(hm);
    if (keys.length > 50) for (const k of keys.slice(0, keys.length - 50)) delete hm[k];
    store.set('hiddenMap', hm);
  }

  async function loadSelection(entry) {
    const seq = ++loadSeq;
    curEntry = entry;
    highlightSlot = null;
    curAnimName = null;
    for (const L of layers) disposeLayer(L);
    layers = [];
    selIdx = -1;
    buildLayerPanel();
    if (partsCtl) partsCtl.refresh();
    buildAnimChips();
    buildSkinChips();
    mName.textContent = entry.label;
    mId.textContent = entry.composite ? entry.group + ' · 整组 ' + entry.layers.length + ' 层' : entry.group;
    const href = entry.composite
      ? '../assets_raw/myassets/spine/' + entry.group + '/'
      : '../' + entry.dir;
    browseLink.href = href;
    browseLink2.href = href;
    store.set('lastChar', entry.id);
    // 深链 + 跨源历史
    const selHash = '#sel=' + encodeURIComponent(entry.id);
    history.replaceState(null, '', location.pathname + location.search + selHash);
    K.history.push({ k: 'majsoul:' + entry.id, src: 'majsoul', t: entry.label, s: entry.group || '', u: location.pathname + selHash });
    // 若在资源库, 关闭并进入舞台
    if (!stageMode) closeGrid();
    status('加载中: ' + entry.label + ' …');
    playerPost('state', { state: 'loading', message: '正在读取角色图层、骨骼与贴图' });
    try {
      if (!(await K.loadRuntime(RUNTIME_SOURCES))) throw new Error('Spine 运行时加载失败');
      if (seq !== loadSeq) return;
      if (!gl) {
        const g = K.createGL(canvas);
        if (!g) throw new Error('无法创建 WebGL 上下文');
        gl = g.mgl; renderer = g.renderer;
      }
      K.resizeCanvas(canvas, renderer);
      const list = entry.composite ? entry.layers : [entry];
      const charHidden = (store.get('hiddenMap', {})[entry.id]) || {};
      for (const e of list) {
        const L = await loadLayerModel(e);
        if (seq !== loadSeq) { disposeLayer(L); return; }
        const saved = charHidden[e.id];
        if (saved && saved.length) {
          L.hiddenSlots = new Set(saved);
          K.applyHiddenSlots(L.skeleton, L.hiddenSlots);
        }
        layers.push(L);
        status('加载中: ' + entry.label + ' (' + layers.length + '/' + list.length + ') …');
      }
      if (seq !== loadSeq) return;
      globalZoom = 1;
      groupOX = 0;
      groupOY = 0;
      refitAll();
      if (layers.length) selIdx = 0;
      buildLayerPanel();
      if (partsCtl) partsCtl.refresh();
      buildAnimChips();
      buildSkinChips();
      status('就绪: ' + entry.label + ' · ' + layers.length + ' 层');
      lastManual = Date.now();
      $('#railStar').textContent = store.get('stars', []).includes(entry.id) ? '★' : '☆';
      // 在下一帧渲染循环里截取缩略图 (WebGL 需同步截取)
      capturePending = entry.id;
      playerReady(seq);
    } catch (e) {
      if (seq !== loadSeq) return;
      status('加载失败: ' + e.message);
      playerPost('error', { code: 'asset-load-failed', message: e.message || String(e) });
      console.error(e);
    }
  }

  // ---------- ArtHub desktop embed bridge ----------
  const playerParams = new URLSearchParams(location.search);
  const playerSessionId = playerParams.get('__arthubSession') || '';
  const playerLoadId = playerParams.get('__arthubLoad') || '';
  let playerDrawnSeq = -1;
  let playerReadySeq = -1;
  let playerFailedSeq = -1;
  function playerPost(type, payload = {}, requestId = null) {
    if (!embedded || !window.parent || window.parent === window) return;
    window.parent.postMessage({
      protocol: 'arthub-player', version: 1, type,
      sessionId: playerSessionId, loadId: playerLoadId,
      source: 'majsoul', assetId: curEntry && curEntry.id ? String(curEntry.id) : '',
      requestId, payload,
    }, location.origin);
  }
  function playerCapabilities() {
    const animationNames = [];
    const parts = [];
    for (const layer of layers) {
      for (const a of (layer.data?.animations || [])) if (!animationNames.includes(a.name)) animationNames.push(a.name);
      for (const slot of (layer.data?.slots || [])) parts.push({
        name: `${layer.entry.id}:${slot.name}`,
        label: `${layer.entry.label} · ${slot.name}`,
        visible: !layer.hiddenSlots.has(String(slot.name)),
      });
    }
    return {
      animations: animationNames.map(name => ({ name: String(name), duration: 0 })),
      parts,
      supports: { play: true, pause: true, seek: false, speed: true, animation: true, parts: true, loop: false, fit: true, resize: true, capture: true },
    };
  }
  function playerPlayback(requestId = null) {
    playerPost('playback', { playing: !pausedAll, speed: speedAll, animation: curAnimName || '', loop: true }, requestId);
  }
  function playerReady(seq) {
    if (!embedded || seq !== loadSeq || !layers.length) return;
    playerDrawnSeq = -1;
    playerReadySeq = -1;
    let finished = false;
    let frames = 0;
    const timer = setTimeout(() => fail(), 5000);
    const fail = () => {
      if (finished) return;
      finished = true; clearTimeout(timer);
      if (seq !== loadSeq || playerFailedSeq === seq) return;
      playerFailedSeq = seq;
      playerPost('error', { code: 'canvas-not-ready', message: 'WebGL 首帧绘制未完成，请重试或检查图形设备' });
    };
    const check = () => {
      if (finished) return;
      if (seq !== loadSeq || !layers.length || playerFailedSeq === seq) { finished = true; clearTimeout(timer); return; }
      frames += 1;
      const raw = gl?.gl || gl;
      if (playerDrawnSeq === seq && canvas.width > 1 && canvas.height > 1 && raw && !raw.isContextLost()) {
        finished = true; clearTimeout(timer); playerReadySeq = seq;
        playerPost('capabilities', playerCapabilities());
        playerPost('state', { state: 'ready', evidence: 'draw-submitted', message: '资源解析完成，首帧已提交绘制', capabilities: playerCapabilities() });
        playerPlayback();
        return;
      }
      if (frames >= 120) { fail(); return; }
      requestAnimationFrame(check);
    };
    requestAnimationFrame(check);
  }
  function setupDesktopBridge() {
    if (!embedded) return;
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== window.parent) return;
      const msg = event.data;
      if (!msg || msg.protocol !== 'arthub-player' || msg.version !== 1 || msg.type !== 'command') return;
      if (!playerSessionId || !playerLoadId || msg.sessionId !== playerSessionId || msg.loadId !== playerLoadId) return;
      if (msg.source !== 'majsoul' || !curEntry || msg.assetId !== String(curEntry.id)) return;
      if (typeof msg.requestId !== 'string' || !msg.requestId || !msg.payload || typeof msg.payload !== 'object' || Array.isArray(msg.payload)) return;
      const replyError = error => playerPost('error', { code: 'command-failed', message: error.message || String(error) }, msg.requestId);
      try {
        const p = msg.payload || {};
        if (msg.command === 'getCapabilities') {
          playerPost('capabilities', playerCapabilities(), msg.requestId);
        } else if (msg.command === 'play') {
          pausedAll = false; setPbPlay(); playerPlayback(msg.requestId);
        } else if (msg.command === 'pause') {
          pausedAll = true; setPbPlay(); playerPlayback(msg.requestId);
        } else if (msg.command === 'setSpeed') {
          speedAll = Math.max(0.05, Math.min(3, Number(p.speed) || 1));
          pbSpeed.value = String(speedAll); pbSpeed.dispatchEvent(new Event('input', { bubbles: true })); playerPlayback(msg.requestId);
        } else if (msg.command === 'setAnimation') {
          const name = String(p.name || '');
          if (!layers.some(layer => layer.data.animations.some(a => a.name === name))) throw new Error('动画不存在: ' + name);
          curAnimName = name; playAll(name, false); buildAnimChips(); playerPlayback(msg.requestId);
        } else if (msg.command === 'setParts') {
          for (const change of (Array.isArray(p.parts) ? p.parts : [])) {
            const [layerId, ...slotParts] = String(change.name || '').split(':');
            const slotName = slotParts.join(':');
            const layer = layers.find(candidate => String(candidate.entry.id) === layerId);
            if (!layer || !slotName || !layer.data.slots.some(slot => String(slot.name) === slotName)) continue;
            if (change.visible === false) layer.hiddenSlots.add(slotName); else layer.hiddenSlots.delete(slotName);
            K.applyHiddenSlots(layer.skeleton, layer.hiddenSlots);
          }
          partsCtl?.refresh(); persistHidden(); playerPost('capabilities', playerCapabilities(), msg.requestId);
        } else if (msg.command === 'fit') {
          doFit(); playerPost('state', { state: 'ready', capabilities: playerCapabilities() }, msg.requestId);
        } else if (msg.command === 'resize') {
          K.resizeCanvas(canvas, renderer); applyAllTransforms();
          playerPost('state', { state: 'ready', capabilities: playerCapabilities() }, msg.requestId);
        } else if (msg.command === 'capture') {
          const captureSeq = loadSeq;
          requestAnimationFrame(() => {
            if (captureSeq !== loadSeq || !layers.length) return;
            try { playerPost('capture-result', { dataUrl: canvas.toDataURL('image/png') }, msg.requestId); }
            catch (error) { replyError(error); }
          });
        } else if (msg.command === 'dispose') {
          loadSeq++; playerReadySeq = -1;
          for (const layer of layers) disposeLayer(layer);
          layers = []; playerPost('state', { state: 'idle' }, msg.requestId);
        } else {
          throw new Error('不支持的命令: ' + String(msg.command));
        }
      } catch (error) { replyError(error); }
    });
  }

  // ---------- 缩略图引擎(合成图层) ----------
  const ThumbStore = (() => {
    let dbp = null;
    function open() {
      if (dbp) return dbp;
      dbp = new Promise((res, rej) => {
        try {
          const rq = indexedDB.open('spine-thumbs', 1);
          rq.onupgradeneeded = () => rq.result.createObjectStore('thumbs');
          rq.onsuccess = () => res(rq.result);
          rq.onerror = () => rej(rq.error);
        } catch (e) { rej(e); }
      }).catch(() => null);
      return dbp;
    }
    return {
      async get(id) {
        const db = await open();
        if (!db) return null;
        return new Promise(res => {
          try {
            const t = db.transaction('thumbs').objectStore('thumbs').get(id);
            t.onsuccess = () => res(t.result || null);
            t.onerror = () => res(null);
          } catch { res(null); }
        });
      },
      async put(id, url) {
        const db = await open();
        if (!db) return;
        return new Promise(res => {
          try {
            const t = db.transaction('thumbs', 'readwrite').objectStore('thumbs').put(url, id);
            t.onsuccess = () => res();
            t.onerror = () => res();
          } catch { res(); }
        });
      },
    };
  })();

  const ThumbGen = (() => {
    let cv2 = null, mgl2 = null, renderer2 = null;
    const mem = new Map();
    const inflight = new Set();
    let chain = Promise.resolve();
    function ensureGL() {
      if (cv2) return true;
      try {
        cv2 = document.createElement('canvas');
        cv2.width = 240; cv2.height = 192;
        const raw = cv2.getContext('webgl', { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
        if (!raw || !window.spine) return false;
        if (window.spine.GLTexture) window.spine.GLTexture.DISABLE_UNPACK_PREMULTIPLIED_ALPHA_WEBGL = true;
        mgl2 = new spine.ManagedWebGLRenderingContext(raw);
        renderer2 = new spine.SceneRenderer(cv2, mgl2);
        return true;
      } catch { return false; }
    }
    async function loadThumbLayer(mgl, e) {
      const dir = '../' + e.dir;
      const atlasName = e.atlas.split('/').pop();
      const am = new spine.AssetManager(mgl, dir);
      const atlas = await new Promise((resolve, reject) => {
        am.loadTextureAtlas(atlasName, (p, a) => resolve(a), reject);
      });
      const resp = await fetch('../' + e.skel);
      if (!resp.ok) throw new Error('skel ' + resp.status);
      const isJson = /\.json$/i.test(e.skel);
      const bytes = new Uint8Array(await resp.arrayBuffer());
      const loader = new spine.AtlasAttachmentLoader(atlas);
      const data = isJson
        ? new spine.SkeletonJson(loader).readSkeletonData(JSON.parse(new TextDecoder().decode(bytes)))
        : new spine.SkeletonBinary(loader).readSkeletonData(bytes);
      const skeleton = new spine.Skeleton(data);
      skeleton.setToSetupPose();
      return { skeleton, atlas, am };
    }
    async function generate(entry) {
      (window.__genSteps = window.__genSteps || []).push('start:' + (entry.id || '?').slice(0, 15));
      if (!ensureGL()) { (window.__genSteps = window.__genSteps || []).push('ERR:no-gl'); throw new Error('no gl'); }
      const list = entry.composite ? entry.layers : [entry];
      const Ls = [];
      {
        for (const e of list) {
          const L = await loadThumbLayer(mgl2, e);
          Ls.push(L);
        }
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, any = false;
        for (const L of Ls) {
          const sk = L.skeleton;
          sk.scaleX = 1; sk.scaleY = 1; sk.x = 0; sk.y = 0; sk.rotation = 0;
          updWT(sk);
          const b = K.measureBounds(sk);
          if (!b || !isFinite(b.minX)) continue;
          any = true;
          minX = Math.min(minX, b.minX); minY = Math.min(minY, b.minY);
          maxX = Math.max(maxX, b.maxX); maxY = Math.max(maxY, b.maxY);
        }
        if (!any) throw new Error('empty');
        const w = maxX - minX, h = maxY - minY;
        const scale = Math.min(240 * 0.92 / w, 192 * 0.92 / h);
        const gox = -(minX + w / 2), goy = -(minY + h / 2);
        for (const L of Ls) {
          L.skeleton.scaleX = scale; L.skeleton.scaleY = scale;
          L.skeleton.x = gox * scale; L.skeleton.y = goy * scale;
          updWT(L.skeleton);
        }
        const raw = mgl2.gl || mgl2;
        raw.clearColor(0, 0, 0, 0);
        raw.clear(raw.COLOR_BUFFER_BIT);
        renderer2.begin();
        for (const L of Ls) renderer2.drawSkeleton(L.skeleton, false);
        renderer2.end();
        const url = cv2.toDataURL('image/png');
        for (const L of Ls) for (const p of L.atlas.pages) if (p && p.texture && p.texture.dispose) p.texture.dispose();
        return url;
      }
    }
    const pendingCbs = new Map(); // id -> { cbs: [cb], entry }
    let active = 0;
    function request(id, entry, cb) {
      if (mem.has(id)) { cb(mem.get(id)); return; }
      if (pendingCbs.has(id)) { pendingCbs.get(id).cbs.push(cb); return; }
      pendingCbs.set(id, { cbs: [cb], entry });
      pump();
    }
    function pump() {
      while (active < 2) {
        let found = null;
        for (const [id, job] of pendingCbs) { if (!job.running) { found = id; break; } }
        if (found === null) break;
        const job = pendingCbs.get(found);
        job.running = true;
        active++;
        run(found, job);
      }
    }
    function run(id, job) {
      const key = 'majsoul:' + id;
      Promise.race([
        generate(job.entry),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 25000)),
      ])
      .then(url => ThumbStore.put(key, url).then(() => url).catch(() => url))
      .catch(e => { (window.__genErrs = window.__genErrs || []).push(String(e && e.message || e)); return ''; })
      .then(url => {
        mem.set(id, url || '');
        pendingCbs.delete(id);
        active--;
        for (const cb of job.cbs) { try { cb(url || ''); } catch {} }
        pump();
      });
    }
    window.__ThumbGen = { request };
    return { request };
  })();

  // ---------- 网格渲染 ----------

  // ---------- 视图控制 ----------
  function zoomBy(factor, anchorX, anchorY) {
    if (!layers.length) return;
    const z1 = globalZoom;
    const z2 = Math.min(4, Math.max(0.1, z1 * factor));
    if (anchorX === undefined) {
      anchorX = canvas.width / 2;
      anchorY = canvas.height / 2;
    }
    const f = curFit();
    groupOX += (anchorX - canvas.width / 2) * (1 / z2 - 1 / z1) / f;
    groupOY += (anchorY - canvas.height / 2) * (1 / z2 - 1 / z1) / f;
    globalZoom = z2;
    applyAllTransforms();
  }
  const doFit = () => {
    globalZoom = 1;
    groupOX = 0;
    groupOY = 0;
    refitAll();
  };
  zIn.addEventListener('click', () => zoomBy(1.25));
  zOut.addEventListener('click', () => zoomBy(0.8));
  zFit.addEventListener('click', doFit);
  $('#zReset').addEventListener('click', doFit);
  $('#btnFit2').addEventListener('click', doFit);
  $('#btnReset2').addEventListener('click', doFit);
  zoomRange.addEventListener('input', () => {
    globalZoom = parseFloat(zoomRange.value);
    applyAllTransforms();
  });
  window.addEventListener('resize', () => {
    K.resizeCanvas(canvas, renderer);
    applyAllTransforms();
  });

  // ---------- 交互(拖层 / 平移 / 选层 / 滚轮) ----------
  let downPos = null, downTime = 0, moved = false, lastPos = null, panMode = false;
  const isChrome = (t) => !!(t.closest && (t.closest('.playbar') || t.closest('.zoom-bar') || t.closest('.rail') || t.closest('.tool-strip') || t.closest('.top-pill') || t.closest('.status') || t.closest('.immersive-exit')));
  stage.addEventListener('contextmenu', e => e.preventDefault());
  stage.addEventListener('pointerdown', (e) => {
    if (isChrome(e.target)) return;
    closePopups();
    downPos = { x: e.clientX, y: e.clientY };
    lastPos = downPos;
    downTime = Date.now();
    moved = false;
    panMode = (e.button === 1 || e.button === 2);
  });
  window.addEventListener('pointermove', (e) => {
    if (!downPos || !layers.length) return;
    if (!lastPos) lastPos = downPos;
    const dpr = window.devicePixelRatio || 1;
    const f = curFit() * globalZoom;
    const dx = (e.clientX - lastPos.x) * dpr / f;
    const dy = -(e.clientY - lastPos.y) * dpr / f;
    lastPos = { x: e.clientX, y: e.clientY };
    if (Math.abs(e.clientX - downPos.x) + Math.abs(e.clientY - downPos.y) > 5) moved = true;
    if (!moved) return;
    if (panMode) {
      groupOX += dx;
      groupOY += dy;
    } else if (selIdx >= 0 && layers[selIdx]) {
      layers[selIdx].ox += dx;
      layers[selIdx].oy += dy;
    } else {
      groupOX += dx;
      groupOY += dy;
    }
    lastManual = Date.now();
    applyAllTransforms();
  });
  window.addEventListener('pointerup', (e) => {
    const wasTap = downPos && !moved && (Date.now() - downTime) < 400;
    downPos = null;
    lastPos = null;
    if (wasTap && !panMode && e.button === 0 && layers.length && !isChrome(e.target)) {
      const i = hitTestLayer(e.clientX, e.clientY);
      selIdx = i;
      syncAfterSelChange();
      status(selIdx >= 0 ? '已选中: ' + layers[selIdx].entry.label + '(拖拽可移动此层)' : '未选中(拖拽移动整组)');
    }
    panMode = false;
  });
  stage.addEventListener('wheel', (e) => {
    if (e.target.closest('.playbar') || e.target.closest('.zoom-bar')) return;
    e.preventDefault();
    if (!layers.length) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const cx = (e.clientX - rect.left) * dpr;
    const cy = (e.clientY - rect.top) * dpr;
    zoomBy(e.deltaY < 0 ? 1.1 : 0.9, cx, cy);
  }, { passive: false });

  function hitTestLayer(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const ax = (clientX - rect.left) * dpr - canvas.width / 2;
    const ay = (clientY - rect.top) * dpr - canvas.height / 2;
    for (let i = layers.length - 1; i >= 0; i--) {
      const L = layers[i];
      if (!L.visible || !L.rawBounds) continue;
      const s = L.fitScale * globalZoom;
      if (!s) continue;
      const lx = ax / s - (groupOX + L.ox);
      const ly = ay / s - (groupOY + L.oy);
      if (lx >= L.rawBounds.minX && lx <= L.rawBounds.maxX && ly >= L.rawBounds.minY && ly <= L.rawBounds.maxY) return i;
    }
    return -1;
  }

  // ---------- 调试视图弹窗 ----------
  makeStagePopup(btnDebug, (pop) => {
    const flags = [
      ['bones', '骨骼线'], ['regions', '区域框'], ['bounds', '包围盒'],
      ['meshHull', '网格轮廓'], ['meshTris', '网格三角面'], ['paths', '路径'], ['clipping', '裁剪形状'],
    ];
    pop.innerHTML = '<div class="col">'
      + '<div class="col-title">调试视图(叠加在模型上,设置自动保存)</div>'
      + flags.map(([k, lbl]) => '<label><input type="checkbox" data-f="' + k + '"' + (debugFlags[k] ? ' checked' : '') + '> ' + lbl + '</label>').join('')
      + '</div>';
    pop.addEventListener('change', (e) => {
      const ch = e.target;
      if (ch.dataset && ch.dataset.f) {
        debugFlags[ch.dataset.f] = ch.checked;
        store.set('debugView', debugFlags);
        btnDebug.classList.toggle('active', K.debugActive(debugFlags));
      }
    });
  });

  // ---------- PNG 导出弹窗 ----------
  makeStagePopup(btnPng, (pop) => {
    let scaleK = 1;
    pop.innerHTML = '<div class="col">'
      + '<div class="col-title" id="pngSize">倍率</div>'
      + '<div class="opt-row"><button data-k="1" class="on">1x</button><button data-k="2">2x</button><button data-k="4">4x</button></div>'
      + '<label><input type="checkbox" class="png-alpha"> 透明背景(不包含背景色)</label>'
      + '<button class="png-go">导出 PNG</button>'
      + '</div>';
    const sizeEl = pop.querySelector('#pngSize');
    const syncSize = () => {
      sizeEl.textContent = '当前画布 ' + canvas.width + '×' + canvas.height + 'px · 导出 '
        + Math.round(canvas.width * scaleK) + '×' + Math.round(canvas.height * scaleK) + 'px';
    };
    syncSize();
    pop.querySelectorAll('.opt-row button').forEach(b => {
      b.addEventListener('click', () => {
        pop.querySelectorAll('.opt-row button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        scaleK = Number(b.dataset.k);
        syncSize();
      });
    });
    pop.querySelector('.png-go').addEventListener('click', async () => {
      closePopups();
      if (!layers.length) { K.toast('没有可导出的图层', 'err'); return; }
      const transparent = pop.querySelector('.png-alpha').checked;
      status('导出 PNG 中…');
      const zoomBak = globalZoom;
      try {
        const r = await K.exportPNG({
          canvas,
          scale: scaleK,
          transparent,
          filename: (curEntry ? String(curEntry.label).replace(/[\\/:*?"<>|\[\]]/g, '') : 'spine')
            + (transparent ? '-透明' : '') + '.png',
          resize(kk) {
            K.syncRendererSize(canvas, gl, renderer);
            globalZoom = zoomBak * kk;
            applyAllTransforms();
          },
          draw(tr) {
            const raw = gl.gl || gl;
            if (tr) raw.clearColor(0, 0, 0, 0);
            else {
              const c = K.parseColor(bgInput.value, [0.09, 0.1, 0.13]);
              raw.clearColor(c[0], c[1], c[2], 1);
            }
            raw.clear(raw.COLOR_BUFFER_BIT);
            renderer.begin();
            for (const L of layers) if (L.visible) renderer.drawSkeleton(L.skeleton, false);
            renderer.end();
          },
          restore() {
            globalZoom = zoomBak;
            K.resizeCanvas(canvas, renderer);
            applyAllTransforms();
          },
        });
        K.toast('已导出 PNG: ' + r.w + '×' + r.h + 'px', 'ok');
      } catch (e) {
        K.toast('导出失败: ' + e.message, 'err');
        console.error(e);
      }
    });
  });

  // ---------- 快捷键 ----------
  K.bindKeys({
    ' ': () => pbPlay.click(),
    'ArrowLeft': () => nav(-1),
    'ArrowRight': () => nav(1),
    'f': doFit, 'F': doFit,
    'g': () => toggleGrid(), 'G': () => toggleGrid(),
    'i': () => toggleImmersive(), 'I': () => toggleImmersive(),
    '+': () => zoomBy(1.25), '=': () => zoomBy(1.25),
    '-': () => zoomBy(0.8),
    's': () => { if (curEntry) toggleStarById(curEntry.id); },
    'S': () => { if (curEntry) toggleStarById(curEntry.id); },
    '?': () => K.showShortcuts('雀魂查看器 · 快捷键', [
      ['← / →', '上/下一个角色'], ['空格', '播放/暂停'], ['F', '适应窗口'],
      ['G', '资源库 / 舞台'], ['I / Tab', '沉浸模式'], ['S', '收藏'],
      ['+ / -', '缩放'], ['Esc', '关闭弹窗'],
    ]),
    'Escape': closePopups,
  });

  // ---------- 角色数据 ----------
  setupDesktopBridge();
  K.initSearchPalette();
  Promise.all([
    fetch('../../thumbs/').then(r => r.ok ? r.json() : { items: {} }).catch(() => ({ items: {} })),
    fetch('../characters.json').then(r => r.json()),
  ]).then(([thumbData, data]) => {
    webThumbs = thumbData.items || {};
    const all = data.characters || [];
    const compositeLayerIds = new Set(
      all.filter(c => c.composite).flatMap(c => c.layers.map(l => l.id))
    );
    characters = all.filter(c => c.composite || !compositeLayerIds.has(c.id));
    const groups = [...new Set(characters.map(c => String(c.group || '').trim()).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    for (const group of groups) {
      const option = document.createElement('option');
      option.value = group;
      option.textContent = group;
      groupFilter.appendChild(option);
    }
    gridGroup = store.get('groupFilter', '');
    if (gridGroup && groups.includes(gridGroup)) groupFilter.value = gridGroup;
    const hashId = new URLSearchParams(location.hash.replace(/^#/, '')).get('sel');
    const lastId = store.get('lastChar', null);
    const first = (hashId && characters.find(x => x.id === hashId))
      || characters.find(x => x.id === lastId) || characters[0];
    if (first) {
      loadSelection(first).then(() => { if (!embedded && !hashId) openGrid(); });
    } else {
      status('未找到角色。请先运行导出脚本');
      openGrid();
    }
  }).catch(e => {
    status('characters.json 读取失败: ' + e.message);
    openGrid();
  });

  // ---------- 自动待机 ----------
  setInterval(() => {
    if (!autoIdleChk.checked || !layers.length) return;
    if (Date.now() - lastManual < 6000) return;
    for (const L of layers) {
      if (!L.visible || !L.idleAnim) continue;
      const cur = L.state.getCurrent(0);
      const isIdle = cur && cur.animation && cur.animation.name === L.idleAnim;
      if (!isIdle) L.state.setAnimation(0, L.idleAnim, true);
    }
  }, 2000);
})();
</script></body></html>
