  html, body { height: 100%; }

  }
  .rail.hide { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(-12px); }
  .rail button {
    width: 36px; height: 36px; border-radius: 50%;

  .thumb-card {

    color: var(--text-faint); font-size: 11px;

  .thumb-card .ph img {
    width: auto; height: auto; max-width: 100%; max-height: 100%;

    width: 18px; height: 18px; border-radius: 50%;

    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .thumb-card .tm { padding: 9px 11px 10px; }
  .thumb-card .tn {
    font-size: 12.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb-card.active .tn { color: var(--accent); }
  .thumb-card .ts {
    font-size: 10.5px; color: var(--text-faint); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .thumb-card .tt {
    position: absolute; top: 9px; left: 9px;
    font-size: 10px; padding: 2.5px 9px; border-radius: 999px;
    background: rgba(0, 0, 0, .55); color: #dfe5ef;
    border: 1px solid rgba(255, 255, 255, .12);
    backdrop-filter: blur(6px);
  }
  .thumb-card .tstar {
    position: absolute; top: 7px; right: 7px;
    background: none; border: none; cursor: pointer;
    font-size: 15px; color: rgba(255, 255, 255, .45);
    padding: 3px; line-height: 1; text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
    transition: transform .15s cubic-bezier(.34, 1.56, .64, 1), color .15s;
  }
  .thumb-card .tstar:hover { transform: scale(1.25); color: #fff; }
  .thumb-card .tstar.on { color: var(--star); }

  body.immersive .rail, body.immersive .top-pill, body.immersive .tool-strip,

  body.immersive .zoom-bar, body.immersive #floatPanel { display: none !important; }

    opacity: .72; transition: opacity .2s;
  }
  body.immersive .immersive-exit:hover { opacity: 1; }

    const THUMB_CACHE_VERSION = 'pose-space-v4';
  const ThumbStore = (() => {
    let dbp = null;
    const keyOf = (id) => THUMB_CACHE_VERSION + ':' + id;
    function open() {
      if (dbp) return dbp;
      dbp = new Promise((res, rej) => {
        try {
          const rq = indexedDB.open('spine-thumbs', 1);
          rq.onupgradeneeded = () => rq.result.createObjectStore('thumbs');
          rq.onsuccess = () => res(rq.result);
          rq.onerror = () => rej(rq.error);
        } catch (e) { rej(e); }
      }).catch(() => null);
      return dbp;
    }
    return {
      async get(id) {
        const db = await open();
        if (!db) return null;
        return new Promise(res => {
          try {
            const t = db.transaction('thumbs').objectStore('thumbs').get(keyOf(id));
            t.onsuccess = () => res(t.result || null);
            t.onerror = () => res(null);
          } catch { res(null); }
        });
      },
      async put(id, url) {
        const db = await open();
        if (!db) return;
        return new Promise(res => {
          try {
            const t = db.transaction('thumbs', 'readwrite').objectStore('thumbs').put(url, keyOf(id));
            t.onsuccess = () => res();
            t.onerror = () => res();
          } catch { res(); }
        });
      },
    };
  })();

  const ThumbGen = (() => {
    const THUMB_SIZE = 384;
    // 离屏渲染上下文按 Spine 版本各持一份（4.0/4.1 各建一个）
    const ctxs = {};
    const mem = new Map();
    const inflight = new Set();
    let chain = Promise.resolve();
    function ensureCtx(vkey, ns) {
      if (ctxs[vkey]) return ctxs[vkey];
      try {
        const cv2 = document.createElement('canvas');
        cv2.width = THUMB_SIZE; cv2.height = THUMB_SIZE;
        const raw = cv2.getContext('webgl', { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
        if (!raw || !ns) return null;
        if (ns.GLTexture) ns.GLTexture.DISABLE_UNPACK_PREMULTIPLIED_ALPHA_WEBGL = true;
        const mgl2 = new ns.ManagedWebGLRenderingContext(raw);
        const renderer2 = new ns.SceneRenderer(cv2, mgl2);
        return (ctxs[vkey] = { cv2, mgl2, renderer2 });
      } catch { return null; }
    }
    function pickPreviewAnimation(data) {
      return data.animations && (
        data.animations.find(a => /^(?:idle|stand|standing|default)$/i.test(a.name)) ||
        data.animations.find(a => /^loop/i.test(a.name)) || data.animations[0]
      );
    }
    function applyPreviewPose(sk, data, SP, time, resourceId) {
      sk.setToSetupPose();
      const anim = pickPreviewAnimation(data);
      if (!anim || !SP.AnimationStateData || !SP.AnimationState) {
        K.updateWorldTransform(sk);
        return null;
      }
      const stateData = new SP.AnimationStateData(data);
      stateData.defaultMix = 0;
      const state = new SP.AnimationState(stateData);
      state.setAnimation(0, anim.name, false);
      state.update(Math.max(0, Number(time) || 0));
      state.apply(sk);
      K.updateWorldTransform(sk);
      return anim;
    }
    async function generate(entry) {
      const vkey = (entry && entry.spineVersion && String(entry.spineVersion).match(/^4\.\d/)) ? entry.spineVersion.match(/^4\.\d/)[0] : '4.1';
      const ctx = ensureCtx(vkey, K.getSpine(entry && entry.spineVersion));
      if (!ctx) throw new Error('no gl');
      const { mgl2, cv2, renderer2 } = ctx;
      const SP = K.getSpine(entry && entry.spineVersion);
      const v = entry.cutscenes[0];
      const base = '../' + v.dir;
      const am = new SP.AssetManager(mgl2, base);
      {
        const atlas = await new Promise((res, rej) => am.loadTextureAtlas(v.atlas, (p, a) => res(a), (p, e) => rej(new Error(e))));
        const loader = new SP.AtlasAttachmentLoader(atlas);
        const resp = await fetch(base + encodeURIComponent(v.skel));
        if (!resp.ok) throw new Error('skel ' + resp.status);
        const data = v.format === 'json'
          ? new SP.SkeletonJson(loader).readSkeletonData(await resp.text())
          : new SP.SkeletonBinary(loader).readSkeletonData(new Uint8Array(await resp.arrayBuffer()));
        const sk = new SP.Skeleton(data);
        const anim = pickPreviewAnimation(data);
        const duration = anim && Number.isFinite(Number(anim.duration)) ? Math.max(0, Number(anim.duration)) : 0;
        // 缩略图必须和舞台一样应用默认动画；同时取几个时间点的并集，避免动作伸展时被包围盒裁掉。
        const sampleTimes = duration > 0 ? [0, duration * 0.25, duration * 0.5, duration * 0.75, duration] : [0];
        let b = null;
        for (const time of sampleTimes) {
          applyPreviewPose(sk, data, SP, time, entry && entry.id);
          const frame = K.measureBounds(sk, SP);
          if (!frame || !(frame.maxX > frame.minX) || !(frame.maxY > frame.minY)) continue;
          b = b ? {
            minX: Math.min(b.minX, frame.minX), minY: Math.min(b.minY, frame.minY),
            maxX: Math.max(b.maxX, frame.maxX), maxY: Math.max(b.maxY, frame.maxY),
          } : frame;
        }
        // 最终仍显示中段姿势，避免缩略图停在入场帧；包围盒使用上面的全程采样结果。
        applyPreviewPose(sk, data, SP, duration > 0 ? duration * 0.5 : 0, entry && entry.id);
        b = b || K.measureBounds(sk, SP);
        if (!b) throw new Error('empty');
        const w = b.maxX - b.minX, h = b.maxY - b.minY;
        if (!(w > 0) || !(h > 0)) throw new Error('invalid bounds');
        const scale = Math.min(THUMB_SIZE * 0.92 / w, THUMB_SIZE * 0.92 / h);
        sk.scaleX = scale; sk.scaleY = scale;
        sk.x = -(b.minX + w / 2) * scale;
        sk.y = -(b.minY + h / 2) * scale;
        K.updateWorldTransform(sk);
        const raw = mgl2.gl || mgl2;
        raw.clearColor(0, 0, 0, 0);
        raw.clear(raw.COLOR_BUFFER_BIT);
        renderer2.begin();
        renderer2.drawSkeleton(sk, !!(atlas.pages && atlas.pages[0] && atlas.pages[0].pma));
        renderer2.end();
        const url = cv2.toDataURL('image/png');
        for (const p of atlas.pages) if (p.texture && p.texture.dispose) p.texture.dispose();
        return url;
      }
    }
    const pendingCbs = new Map(); // id -> { cbs: [cb], entry }
    let active = 0;
    function request(id, entry, cb) {
      if (mem.has(id)) { cb(mem.get(id)); return; }
      if (pendingCbs.has(id)) { pendingCbs.get(id).cbs.push(cb); return; }
      pendingCbs.set(id, { cbs: [cb], entry });
      pump();
    }
    function pump() {
      while (active < 2) {
        let found = null;
        for (const [id, job] of pendingCbs) { if (!job.running) { found = id; break; } }
        if (found === null) break;
        const job = pendingCbs.get(found);
        job.running = true;
        active++;
        run(found, job);
      }
    }
    function run(id, job) {
      Promise.race([
        generate(job.entry),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000)),
      ])
      .then(url => ThumbStore.put('t:' + id, url).then(() => url).catch(() => url))
      .catch(() => '')
      .then(url => {
        mem.set(id, url || '');
        pendingCbs.delete(id);
        active--;
        for (const cb of job.cbs) { try { cb(url || ''); } catch {} }
        pump();
      });
    }
    return { request };
  })();

  function renderPagination() {
    const nav = $('#gridPagination');
    if (!nav) return;
    const totalPages = Math.max(1, Math.ceil(gridArr.length / GRID_PAGE));
    gridPage = Math.min(Math.max(gridPage, 1), totalPages);
    nav.innerHTML = '';
    if (!gridArr.length || totalPages <= 1) {
      nav.hidden = true;
      return;
    }
    nav.hidden = false;
    const addButton = (label, page, options = {}) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'grid-page-btn' + (options.current ? ' on' : '');
      b.textContent = label;
      b.disabled = !!options.disabled;
      if (options.current) b.setAttribute('aria-current', 'page');
      if (!options.disabled && page !== undefined) b.onclick = () => {
        gridPage = page;
        renderGrid();
        gridView.scrollTo({ top: 0, behavior: 'smooth' });
      };
      nav.appendChild(b);
    };
    addButton('\u2039', gridPage - 1, { disabled: gridPage <= 1 });
    const pages = [];
    const push = p => { if (!pages.includes(p)) pages.push(p); };
    push(1);
    for (let p = Math.max(2, gridPage - 2); p <= Math.min(totalPages - 1, gridPage + 2); p++) push(p);
    if (totalPages > 1) push(totalPages);
    let previous = 0;
    for (const page of pages) {
      if (previous && page - previous > 1) {
        const gap = document.createElement('span');
        gap.className = 'grid-page-gap';
        gap.textContent = '\u2026';
        nav.appendChild(gap);
      }
      addButton(String(page), page, { current: page === gridPage });
      previous = page;
    }
    addButton('\u203a', gridPage + 1, { disabled: gridPage >= totalPages });
  }

  function renderGrid() {
    const grid = $('#thumbGrid');
    const q = gridQuery.trim().toLowerCase();
    let arr = getFilteredChars();
    if (q) arr = arr.filter(c => {
      const alias = aliasOf(c.id);

        || (c.source || '').toLowerCase().includes(q) || c.id.toLowerCase().includes(q);

    grid.innerHTML = '';
    const starred = new Set(store.get('stars', []));
    gridArr = arr;
    const totalPages = Math.max(1, Math.ceil(gridArr.length / GRID_PAGE));
    gridPage = Math.min(Math.max(gridPage, 1), totalPages);
    const start = (gridPage - 1) * GRID_PAGE;
    const end = Math.min(start + GRID_PAGE, gridArr.length);
    gridShown = start;
    for (let i = start; i < end; i++) {
      buildCard(grid, starred, gridArr[i]);
      gridShown++;

    $('#gridSub').textContent = gridArr.length
      ? gridArr.length + ' \u4e2a\u8d44\u6e90 \u00b7 \u7b2c ' + gridPage + ' / ' + totalPages + ' \u9875'

  // 画布坐标(与部件点选同一世界坐标系)
  const wpt = (cx, cy) => {
    const rect = cv.getBoundingClientRect();
    const dpr = devicePixelRatio || 1;
    return [(cx - rect.left) * dpr - cv.width / 2, cv.height / 2 - (cy - rect.top) * dpr];
  };

  function hitBoneAt(clientX, clientY) {
    if (!cut) return null;
    const [wx, wy] = wpt(clientX, clientY);
    const scale = cut.skeleton.scaleX || 1;
    const thresh = 26 / scale;
    let best = null;
    for (const bone of cut.skeleton.bones) {
      let d = Math.hypot(bone.worldX - wx, bone.worldY - wy);
      if (d < thresh && (!best || d < best.d)) best = { bone, d, mode: 'move' };
      if (bone.data.length > 0) {
        const tx = bone.worldX + bone.a * bone.data.length;
        const ty = bone.worldY + bone.c * bone.data.length;
        d = Math.hypot(tx - wx, ty - wy);
        if (d < thresh && (!best || d < best.d)) best = { bone, d, mode: 'rotate' };
      }
    }
    return best;
  }

  function drawEditSkeleton(renderer) {
    if (!cut) return;
    const selCol = { r: 1, g: 0.42, b: 0.13, a: 1 };
    const hovCol = { r: 1, g: 0.78, b: 0.3, a: 0.95 };
    const normCol = { r: 0.62, g: 0.7, b: 0.85, a: 0.4 };
    for (const bone of cut.skeleton.bones) {
      const len = bone.data.length;
      const tx = bone.worldX + bone.a * len;
      const ty = bone.worldY + bone.c * len;
      const isSel = bone.data.name === editBoneName;
      const isHov = bone.data.name === hoverBoneName;
      const col = isSel ? selCol : (isHov ? hovCol : normCol);
      renderer.line(bone.worldX, bone.worldY, tx, ty, col);
      if (len > 0 && (isSel || isHov)) {
        const s = 4 / (cut.skeleton.scaleX || 1);
        renderer.quad(true, tx - s, ty - s, tx + s, ty - s, tx + s, ty + s, tx - s, ty + s, col);
      }
    }
  }
  function drawBoneMarker(renderer) {
    if (!editBoneName || !cut) return;
    const bone = cut.skeleton.findBone(editBoneName);
    if (!bone) return;
    const col = { r: 1, g: 0.42, b: 0.13, a: 1 };
    const len = bone.data.length;
    const tx = bone.worldX + bone.a * len;
    const ty = bone.worldY + bone.c * len;
    renderer.line(bone.worldX, bone.worldY, tx, ty, col);
    const s = 6 / (cut.skeleton.scaleX || 1);
    renderer.quad(true,
      bone.worldX - s, bone.worldY - s,
      bone.worldX + s, bone.worldY - s,
      bone.worldX + s, bone.worldY + s,
      bone.worldX - s, bone.worldY + s, col);
  }

  function capturePose() {
    const bones = {};

  function applyPoseToSkeleton(skeleton, bones) {
    for (const b of skeleton.bones) {
      const p = bones[b.data.name];

  // ---------- 播放条 ----------
  const getTrack = () => { const t = cut && cut.state.getCurrent(0); return t && t.animation ? t : null; };
  function seekTo(ratio) {
    const track = getTrack();
    if (!track) return;
    track.trackTime = ratio * (track.animation.duration || 0.0001);
    if (!playing) { cut.state.apply(cut.skeleton); }
    syncTimeline();
  }
  function stepFrame(dir) {
    const track = getTrack();
    if (!track) return;
    const dur = track.animation.duration || 0.0001;
    let t = track.trackTime + dir * (1 / 30);
    if (t < 0) t = loopAnim ? dur + t : 0;
    if (t > dur) t = loopAnim ? t - dur : dur;
    track.trackTime = t;
    if (!playing) { cut.state.apply(cut.skeleton); }
    syncTimeline();
  }
  function syncTimeline() {
    const track = getTrack();
    if (!track) { pbTime.textContent = '0.00 / 0.00s'; return; }
    const dur = track.animation.duration || 0.0001;
    const t = ((track.trackTime % dur) + dur) % dur;
    pbRange.value = String(Math.round(t / dur * 1000));
    pbTime.textContent = t.toFixed(2) + ' / ' + dur.toFixed(2) + 's';
  }

  pbRange.addEventListener('input', () => seekTo(Number(pbRange.value) / 1000));
  $('#pbStepB').addEventListener('click', () => stepFrame(-1));
  $('#pbStepF').addEventListener('click', () => stepFrame(1));

    if (cut) cut.state.timeScale = Number(pbSpeed.value);

  function fmtSpeed(v) { return Number(v).toFixed(2).replace(/0+$/, '').replace(/\.$/, '') + 'x'; }

  // ---------- 渲染循环 ----------
  function loop(t) {
    requestAnimationFrame(loop);
    const dt = lastT ? Math.min((t - lastT) / 1000, 0.25) : 0;
    lastT = t;
    try {
    if (cut) {
      if (playing) {
        cut.state.update(dt);
        cut.state.apply(cut.skeleton);
      }
      if (poseLocked) applyPoseToSkeleton(cut.skeleton, poseLocked);
      K.updateWorldTransform(cut.skeleton);
      K.applyHiddenSlots(cut.skeleton, cut.hiddenSlots);
    }
    if (cmpOn && cmp) {
      if (playing) { cmp.state.update(dt); cmp.state.apply(cmp.skeleton); }
      K.updateWorldTransform(cmp.skeleton);
    }
    if (mgl && renderer) {
      const raw = mgl.gl || mgl;
      const bgv = getBg();
      if (bgv === 'checker') raw.clearColor(0, 0, 0, 0);
      else {
        const c = K.parseColor(bgv, [0.06, 0.07, 0.09]);
        raw.clearColor(c[0], c[1], c[2], 1);
      }
      raw.clear(raw.COLOR_BUFFER_BIT);
      renderer.begin();
      if (cut) renderer.drawSkeleton(cut.skeleton, cut.pma);
      if (cmpOn && cmp) renderer.drawSkeleton(cmp.skeleton, cmp.pma);
      if (cut && K.debugActive(debugFlags)) {
        K.applyDebugFlags(renderer, debugFlags);
        K.drawDebug(renderer, [cut.skeleton]);
      }
      if (cut && highlightSlot) K.drawSlotHighlight(renderer, cut.skeleton, highlightSlot);
      if (boneEditMode) drawEditSkeleton(renderer);
      drawBoneMarker(renderer);
      renderer.end();
      if (cut && cv.width > 1 && cv.height > 1 && !raw.isContextLost()) playerDrawnSeq = cutLoadSeq;
    }
    if (cut && playing) syncTimeline();
    if (embedded && cut && playerReadySeq === cutLoadSeq && t - playerLastPlayback >= 125) {
      playerLastPlayback = t;
      playerPlayback();
    }
    } catch (error) {
      if (embedded && playerFailedSeq !== cutLoadSeq) {
        playerFailedSeq = cutLoadSeq;
        playerReadySeq = -1;
        playerPost('error', { code: 'render-failed', message: error.message || String(error) });
      }
    }
  }

  // ---------- 视图 ----------
  function computeView() {
    if (!cut) return;
    const b = cut.bounds;
    cut.centerX = -(b.minX + (b.maxX - b.minX) / 2);
    cut.centerY = -(b.minY + (b.maxY - b.minY) / 2);
    cut.fitScale = Math.min((cv.width * 0.92) / (b.maxX - b.minX), (cv.height * 0.92) / (b.maxY - b.minY));
  }
  function applyView() {
    if (!cut) return;
    const scale = fitMode ? ((cmpOn && cmp) ? cmp.fitScale : cut.fitScale) : userScale;
    cut.skeleton.scaleX = scale;
    cut.skeleton.scaleY = scale;
    cut.skeleton.x = panX + cut.centerX * scale - (cmpOn && cmp ? cmp.sepMain * scale : 0);
    cut.skeleton.y = panY + cut.centerY * scale;
    if (cmpOn && cmp) {
      cmp.skeleton.scaleX = scale;
      cmp.skeleton.scaleY = scale;
      cmp.skeleton.x = panX + cmp.centerX * scale + cmp.sepCmp * scale;
      cmp.skeleton.y = panY + cmp.centerY * scale;
    }
    updateZoomPct();
  }
  function refit() { if (!cut) return; panX = 0; panY = 0; if (cmpOn && cmp) computeCompareView(); computeView(); applyView(); }
  function set100() { if (!cut) return; fitMode = false; userScale = 1; panX = 0; panY = 0; applyView(); }
  function resetViewForLoad() { fitMode = true; userScale = 1; panX = 0; panY = 0; }
  function zoomBy(factor, anchorX, anchorY) {
    if (!cut) return;
    const old = fitMode ? cut.fitScale : userScale;
    const next = Math.min(8, Math.max(0.05, old * factor));
    if (anchorX === undefined) { anchorX = cv.width / 2; anchorY = cv.height / 2; }
    panX = anchorX - (anchorX - panX) * (next / old);
    panY = anchorY - (anchorY - panY) * (next / old);
    fitMode = false;
    userScale = next;
    applyView();
    btn100.classList.add('active'); btnFit.classList.remove('active');
  }
  function updateZoomPct() {
    $('#zPct').textContent = (!cut || fitMode) ? '适应' : Math.round(userScale / (cut.fitScale || 1) * 100) + '%';
  }
  function mergeBounds(a, b) {
    if (!b || !(b.maxX > b.minX) || !(b.maxY > b.minY)) return a;
    if (!a) return { minX: b.minX, minY: b.minY, maxX: b.maxX, maxY: b.maxY };
    return {
      minX: Math.min(a.minX, b.minX), minY: Math.min(a.minY, b.minY),
      maxX: Math.max(a.maxX, b.maxX), maxY: Math.max(a.maxY, b.maxY),
    };
  }

  // Sample the active animation so transitions cannot grow beyond a fit based on its first frame.
  function measureAnimationBounds(target, name) {
    if (!target || !target.data || !name) return target && target.bounds ? target.bounds : null;
    const SP = K.getSpine(cur && cur.spineVersion);
    const anim = target.data.animations && target.data.animations.find(a => a.name === name);
    if (!SP || !anim || !SP.AnimationState || !SP.AnimationStateData) return target.bounds || null;
    const duration = Math.max(0, Number(anim.duration) || 0);
    const times = duration > 0
      ? [0, duration * 0.125, duration * 0.25, duration * 0.375, duration * 0.5,
        duration * 0.625, duration * 0.75, duration * 0.875, duration * 0.99, duration]
      : [0];
    let bounds = null;
    try {
      const sample = new SP.Skeleton(target.data);
      for (const time of times) {
        sample.setToSetupPose();
        const stateData = new SP.AnimationStateData(target.data);
        stateData.defaultMix = 0;
        const state = new SP.AnimationState(stateData);
        state.setAnimation(0, anim.name, false);
        state.update(time);
        state.apply(sample);
        K.updateWorldTransform(sample);
        K.applyHiddenSlots(sample, target.hiddenSlots);
        bounds = mergeBounds(bounds, K.measureBounds(sample, SP));
      }
    } catch {}
    return bounds || target.bounds || null;
  }

  function playAnimation(name) {
    if (!cut) return;
    cut.state.clearTracks();
    cut.skeleton.setToSetupPose();
    cut.state.setAnimation(0, name, loopAnim);
    cut.state.timeScale = Number(pbSpeed.value);
    cut.state.update(0);
    cut.state.apply(cut.skeleton);
    K.updateWorldTransform(cut.skeleton);
    K.applyHiddenSlots(cut.skeleton, cut.hiddenSlots);
    if (cmpOn && cmp && cmp.data.animations.some(a => a.name === name)) {
      cmp.state.clearTracks();
      cmp.skeleton.setToSetupPose();
      cmp.state.setAnimation(0, name, loopAnim);
      cmp.state.timeScale = Number(pbSpeed.value);
      cmp.state.update(0);
      cmp.state.apply(cmp.skeleton);
      K.updateWorldTransform(cmp.skeleton);
    }
    const bounds = measureAnimationBounds(cut, name);
    if (bounds) cut.bounds = bounds;
    if (cmpOn && cmp && cmp.data.animations.some(a => a.name === name)) {
      const cmpBounds = measureAnimationBounds(cmp, name);
      if (cmpBounds) cmp.bounds = cmpBounds;
    }
    if (animCtl) animCtl.refresh();
    if (fitMode) refit();
    syncUrl(name);
  }

  // ---------- ArtHub desktop embed bridge ----------
  const playerParams = new URLSearchParams(location.search);
  const playerSessionId = playerParams.get('__arthubSession') || '';
  const playerLoadId = playerParams.get('__arthubLoad') || '';
  let playerDrawnSeq = -1;
  let playerReadySeq = -1;
  let playerFailedSeq = -1;
  let playerLastPlayback = 0;
  function playerPost(type, payload = {}, requestId = null) {
    if (!embedded || !window.parent || window.parent === window) return;
    window.parent.postMessage({
      protocol: 'arthub-player', version: 1, type,
      sessionId: playerSessionId, loadId: playerLoadId,
      source: routeSource, assetId: cur && cur.id ? String(cur.id) : '',
      requestId, payload,
    }, location.origin);
  }
  function playerCapabilities() {
    const animations = cut?.data?.animations || [];
    const parts = (cut?.data?.slots || []).map(slot => ({
      name: String(slot.name), visible: !cut.hiddenSlots.has(String(slot.name)),
    }));
    return {
      animations: animations.map(a => ({ name: String(a.name), duration: Number(a.duration) || 0 })),
      parts,
      supports: { play: true, pause: true, seek: true, speed: true, animation: true, parts: true, loop: true, fit: true, resize: true, capture: true },
    };
  }
  function playerPlayback(requestId = null) {
    const track = getTrack();
    const duration = Number(track?.animation?.duration) || 0;
    const elapsed = Math.max(0, Number(track?.trackTime) || 0);
    const time = duration > 0 ? (loopAnim ? elapsed % duration : Math.min(elapsed, duration)) : 0;
    if (!loopAnim && duration > 0 && elapsed >= duration && playing) { playing = false; setPlayBtn(); }
    playerPost('playback', {
      playing, speed: Number(pbSpeed.value) || 1, animation: animSel.value || '',
      loop: loopAnim, time, duration,
    }, requestId);
  }
  function playerReady(seq) {
    if (!embedded || seq !== cutLoadSeq || !cut) return;
    playerDrawnSeq = -1;
    playerReadySeq = -1;
    let finished = false;
    let frames = 0;
    const timer = setTimeout(() => fail(), 5000);
    const fail = () => {
      if (finished) return;
      finished = true; clearTimeout(timer);
      if (seq !== cutLoadSeq || playerFailedSeq === seq) return;
      playerFailedSeq = seq;
      playerPost('error', { code: 'canvas-not-ready', message: 'WebGL 首帧绘制未完成，请重试或检查图形设备' });
    };
    const check = () => {
      if (finished) return;
      if (seq !== cutLoadSeq || !cut || playerFailedSeq === seq) { finished = true; clearTimeout(timer); return; }
      frames += 1;
      const raw = mgl?.gl || mgl;
      if (playerDrawnSeq === seq && cv.width > 1 && cv.height > 1 && raw && !raw.isContextLost()) {
        finished = true; clearTimeout(timer); playerReadySeq = seq;
        playerPost('capabilities', playerCapabilities());
        playerPost('state', { state: 'ready', evidence: 'draw-submitted', message: '资源解析完成，首帧已提交绘制', capabilities: playerCapabilities() });
        playerPlayback();
        return;
      }
      if (frames >= 120) { fail(); return; }
      requestAnimationFrame(check);
    };
    requestAnimationFrame(check);
  }
  function setupDesktopBridge() {
    if (!embedded) return;
    window.addEventListener('message', event => {
      if (event.origin !== location.origin || event.source !== window.parent) return;
      const msg = event.data;
      if (!msg || msg.protocol !== 'arthub-player' || msg.version !== 1 || msg.type !== 'command') return;
      if (!playerSessionId || !playerLoadId || msg.sessionId !== playerSessionId || msg.loadId !== playerLoadId) return;
      if (msg.source !== routeSource || !cur || msg.assetId !== String(cur.id)) return;
      if (typeof msg.requestId !== 'string' || !msg.requestId || !msg.payload || typeof msg.payload !== 'object' || Array.isArray(msg.payload)) return;
      const replyError = error => playerPost('error', { code: 'command-failed', message: error.message || String(error) }, msg.requestId);
      try {
        const p = msg.payload || {};
        if (msg.command === 'getCapabilities') {
          playerPost('capabilities', playerCapabilities(), msg.requestId);
        } else if (msg.command === 'play') {
          playing = true; setPlayBtn(); playerPlayback(msg.requestId);
        } else if (msg.command === 'pause') {
          playing = false; setPlayBtn(); playerPlayback(msg.requestId);
        } else if (msg.command === 'seek') {
          seekTo(Math.max(0, Math.min(1, Number(p.ratio) || 0))); playerPlayback(msg.requestId);
        } else if (msg.command === 'setSpeed') {
          const value = Math.max(0.05, Math.min(3, Number(p.speed) || 1));
          pbSpeed.value = String(value); pbSpeed.dispatchEvent(new Event('input', { bubbles: true })); playerPlayback(msg.requestId);
        } else if (msg.command === 'setLoop') {
          loopAnim = p.loop !== false; setLoopBtn(); if (cut && animSel.value) playAnimation(animSel.value); playerPlayback(msg.requestId);
        } else if (msg.command === 'setAnimation') {
          const name = String(p.name || '');
          if (!cut || !cut.data.animations.some(a => a.name === name)) throw new Error('动画不存在: ' + name);
          animSel.value = name; playAnimation(name); playerPlayback(msg.requestId);
        } else if (msg.command === 'setParts') {
          const changes = Array.isArray(p.parts) ? p.parts : [];
          for (const change of changes) {
            const name = String(change.name || '');
            if (!name || !cut?.data?.slots?.some(slot => String(slot.name) === name)) continue;
            if (change.visible === false) cut.hiddenSlots.add(name); else cut.hiddenSlots.delete(name);
          }
          if (cut) { K.applyHiddenSlots(cut.skeleton, cut.hiddenSlots); partsCtl?.refresh(); updatePartsBadge(); persistHidden(); }
          playerPost('capabilities', playerCapabilities(), msg.requestId);
        } else if (msg.command === 'fit') {
          refit(); playerPost('state', { state: 'ready', capabilities: playerCapabilities() }, msg.requestId);
        } else if (msg.command === 'resize') {
          K.resizeCanvas(cv, renderer); if (cut) { computeView(); applyView(); }
          playerPost('state', { state: 'ready', capabilities: playerCapabilities() }, msg.requestId);
        } else if (msg.command === 'capture') {
          const captureSeq = cutLoadSeq;
          requestAnimationFrame(() => {
            if (captureSeq !== cutLoadSeq || !cut) return;
            try { playerPost('capture-result', { dataUrl: cv.toDataURL('image/png') }, msg.requestId); }
            catch (error) { replyError(error); }
          });
        } else if (msg.command === 'dispose') {
          cutLoadSeq++; playerReadySeq = -1;
          disposeCut(); playerPost('state', { state: 'idle' }, msg.requestId);
        } else {
          throw new Error('不支持的命令: ' + String(msg.command));
        }
      } catch (error) { replyError(error); }
    });
  }

  // ---------- 资源选择 ----------
  function selectChar(c, restore) {
    cur = c;
    cutLoadSeq++;
    resetViewForLoad();
    hidePartPopup();
    disposeCut();
    disposeCompare();
    closeGrid();
    editBoneName = null;
    boneDrag = null;
    poseLocked = null;
    hoverBoneName = null;
    for (const k in editOrig) delete editOrig[k];
    $('#poseLock').classList.remove('on');
    const alias = aliasOf(c.id);
    mName.textContent = alias || c.name || c.id;
    mId.textContent = (alias ? ((chars.find(x => x.id === c.id) || {}).name + ' · ') : '') + c.id;
    $('#railStar').textContent = store.get('stars', []).includes(c.id) ? '★' : '☆';
    const rt = $('#railThumb');
    rt.innerHTML = '';
    ThumbGen.request(c.id, c, (url) => { if (url) rt.innerHTML = '<img src="' + url + '">'; });
    const vs = variantSel;
    vs.innerHTML = c.cutscenes.map((v, i) => '<option value="' + i + '">' + K.esc(v.variant || '默认') + '</option>').join('');
    vs.style.display = c.cutscenes.length > 1 ? '' : 'none';
    vs.onchange = () => loadCutscene(Number(vs.value));
    updateCompareBtn();
    animSel.innerHTML = '<option>读取中…</option>';
    const startVar = restore && restore.variant != null ? restore.variant : 0;
    vs.value = String(Math.min(startVar, c.cutscenes.length - 1));
    store.set('lastChar', { id: c.id, variant: Number(vs.value), anim: restore ? restore.anim : null });
    loadCutscene(Number(vs.value), restore ? restore.anim : null);
  }
  function syncUrl(animName) {
    if (!cur) return;
    const p = new URLSearchParams(location.search);
    p.set('id', cur.id);
    if (animName) p.set('anim', animName); else p.delete('anim');
    const q = p.toString();
    history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
  }

  // ---------- 加载 ----------
  // 渲染器按 Spine 版本缓存: 切换 4.0/4.1 资源时重建(共享同一 WebGL 上下文)
  let mglKey = null;
  function curVerKey() {
    const v = cur && cur.spineVersion;
    const m = v && String(v).match(/^4\.\d/);
    return m ? m[0] : '4.1';
  }
  function ensureGL() {
    const key = curVerKey();
    if (mgl && mglKey === key) return true;
    const g = K.createGL(cv, K.getSpine(cur && cur.spineVersion));
    if (!g) return false;
    mgl = g.mgl; renderer = g.renderer; mglKey = key;
    K.resizeCanvas(cv, renderer);
    return true;
  }
  function disposeAtlas(atlas) {
    try { if (atlas) for (const p of atlas.pages) if (p.texture && p.texture.dispose) p.texture.dispose(); } catch {}
  }
  function disposeCut() {
    if (cut) {
      disposeAtlas(cut.atlas);
      cut = null;
      if (partsCtl) partsCtl.refresh();
      if (animCtl) animCtl.refresh();
    }
  }

  // ---------- 原版对比模式 (仅 bd2mod: 同角色号 原版↔Mod 并排同步播放) ----------
  let cmp = null, cmpOn = false, cmpOffset = 0, origByNum = null;

  function disposeCompare() {
    if (cmp) { disposeAtlas(cmp.atlas); cmp = null; }
    cmpOn = false;
  }
  function updateCompareBtn() {
    const btn = $('#railCompare');
    if (!btn) return;
    let num = null;
    if (routeSource === 'bd2mod' && cur && origByNum) {
      const m = ((cur.cutscenes[0] || {}).skel || '').match(/char(\d{6})/i);
      if (m && origByNum[m[1]]) num = m[1];
    }
    btn.style.display = num ? '' : 'none';
    btn.dataset.num = num || '';
  }
  function computeCompareView() {
    if (!cmp || !cut) return;
    const b1 = cut.bounds, b2 = cmp.bounds;
    const w1 = b1.maxX - b1.minX, h1 = b1.maxY - b1.minY;
    const w2 = b2.maxX - b2.minX, h2 = b2.maxY - b2.minY;
    const gap = Math.min(w1, w2) * 0.3;
    // 严格居中: 左模型偏移用右模型宽度, 右模型偏移用左模型宽度
    const span = w1 + w2 + gap;
    cmp.sepMain = span / 2 - w1 / 2;
    cmp.sepCmp = span / 2 - w2 / 2;
    cmp.fitScale = Math.min((cv.width * 0.92) / span, (cv.height * 0.92) / Math.max(h1, h2));
  }
  async function toggleCompare() {
    if (cmpOn) { disposeCompare(); applyView(); status('已退出对比模式'); return; }
    const num = $('#railCompare').dataset.num;
    if (!num) return;
    const reqCur = cur;
    status('加载原版 ' + num + ' …');
    try {
      const entry = origByNum[num];
      const v = entry.cutscenes[0];
      const dir = '/bd2/' + v.dir;
      const SP = K.getSpine(cur && cur.spineVersion);
      const am = new SP.AssetManager(mgl, dir);
      const atlas = await new Promise((res, rej) => am.loadTextureAtlas(v.atlas, (p, a) => res(a), (p, e) => rej(new Error(e))));
      if (cur !== reqCur) { disposeAtlas(atlas); return; }
      const loader = new SP.AtlasAttachmentLoader(atlas);
      const resp = await fetch(dir + encodeURIComponent(v.skel));
      if (!resp.ok) throw new Error('skeleton ' + resp.status);
      if (cur !== reqCur) { disposeAtlas(atlas); return; }
      const data = (v.format === 'json' || /\.json$/i.test(v.skel))
        ? new SP.SkeletonJson(loader).readSkeletonData(await resp.text())
        : new SP.SkeletonBinary(loader).readSkeletonData(new Uint8Array(await resp.arrayBuffer()));
      const skeleton = new SP.Skeleton(data);
      skeleton.setToSetupPose();
      const stateData = new SP.AnimationStateData(data);
      stateData.defaultMix = 0.15;
      const state = new SP.AnimationState(stateData);
      // 先应用要同步的动画再量包围盒(与主模型姿态一致)
      const curAnim = animSel.value;
      const anim = data.animations.find(a => a.name === curAnim)
        || data.animations.find(a => /^loop/i.test(a.name))
        || data.animations[0];
      if (anim) {
        state.setAnimation(0, anim.name, loopAnim);
        state.timeScale = Number(pbSpeed.value);
        state.update(0);
        state.apply(skeleton);
      }
      K.updateWorldTransform(skeleton);
      let bounds = K.measureBounds(skeleton, SP);
      if (!bounds && data.skins && data.skins.length) {
        const skin = data.skins.find(s => s.name === 'default') || data.skins[0];
        try { skeleton.setSkin(skin); skeleton.setSlotsToSetupPose(); if (anim) state.apply(skeleton); K.updateWorldTransform(skeleton); } catch {}
        bounds = K.measureBounds(skeleton, SP);
      }
      if (!bounds) throw new Error('原版资源量不出包围盒');
      cmp = {
        skeleton, state, atlas, data, bounds,
        pma: !!(atlas.pages && atlas.pages[0] && atlas.pages[0].pma),
        centerX: -(bounds.minX + (bounds.maxX - bounds.minX) / 2),
        centerY: -(bounds.minY + (bounds.maxY - bounds.minY) / 2),
      };
      cmpOn = true;
      computeCompareView();
      applyView();
      status('对比模式: 原版 ' + entry.id + (anim ? ' · ' + anim.name : '') + ' ↔ Mod ' + (cur.name || cur.id) + ' · 再按 ⇋ 退出');
    } catch (e) {
      disposeCompare();
      status('对比加载失败: ' + e.message);
      console.error(e);
    }
  }
  $('#railCompare').addEventListener('click', () => toggleCompare());
  async function loadCutscene(idx, restoreAnim) {
    const seq = ++cutLoadSeq;
    disposeCut();
    resetViewForLoad();
    hidePartPopup();
    highlightSlot = null;
    const v = cur.cutscenes[idx] || cur.cutscenes[0];
    if (!v) { status((cur.name || cur.id) + ' · 无过场'); return; }
    if (!ensureGL()) { status('WebGL 不可用'); return; }
    status('加载: ' + (cur.name || cur.id) + ' …');
    playerPost('state', { state: 'loading', message: '正在读取骨骼、Atlas 与贴图' });
    try {
      const dir = '../' + v.dir;
      const SP = K.getSpine(cur && cur.spineVersion);
      const am = new SP.AssetManager(mgl, dir);
      const atlas = await new Promise((resolve, reject) => {
        am.loadTextureAtlas(v.atlas, (p, a) => resolve(a), (p, e) => reject(new Error(e)));
      });
      if (seq !== cutLoadSeq) { disposeAtlas(atlas); return; }
      const loader = new SP.AtlasAttachmentLoader(atlas);
      let data;
      if (v.format === 'json') {
        const resp = await fetch(dir + encodeURIComponent(v.skel));
        if (seq !== cutLoadSeq) { disposeAtlas(atlas); return; }
        if (!resp.ok) throw new Error('skeleton 404');
        const text = await resp.text();
        if (seq !== cutLoadSeq) { disposeAtlas(atlas); return; }
        data = new SP.SkeletonJson(loader).readSkeletonData(text);
      } else {
        const resp = await fetch(dir + encodeURIComponent(v.skel));
        if (seq !== cutLoadSeq) { disposeAtlas(atlas); return; }
        if (!resp.ok) throw new Error('skel 404');
        const bytes = new Uint8Array(await resp.arrayBuffer());
        if (seq !== cutLoadSeq) { disposeAtlas(atlas); return; }
        data = new SP.SkeletonBinary(loader).readSkeletonData(bytes);
      }
      const skeleton = new SP.Skeleton(data);
      skeleton.setToSetupPose();
      const stateData = new SP.AnimationStateData(data);
      stateData.defaultMix = 0.15;
      const state = new SP.AnimationState(stateData);
      // 先定默认动画并应用, 再量包围盒(setup pose 与动画姿态差异可能很大)
      animSel.innerHTML = data.animations.map(a => '<option value="' + K.esc(a.name) + '">' + K.esc(a.name) + '</option>').join('');
      const urlAnim = new URLSearchParams(location.search).get('anim');
      const saved = restoreAnim && data.animations.some(a => a.name === restoreAnim) ? restoreAnim : null;
      const previewAnim = data.animations.find(a => /^(?:idle|stand|standing|default)$/i.test(a.name))
        || data.animations.find(a => /^loop/i.test(a.name))
        || data.animations[0];
      const def = saved || (urlAnim && data.animations.some(a => a.name === urlAnim) ? urlAnim : null)
        || (previewAnim && previewAnim.name);
      state.setAnimation(0, def, loopAnim);
      state.update(0);
      state.apply(skeleton);
      K.updateWorldTransform(skeleton);
      const stageNS = K.getSpine(cur && cur.spineVersion);
      let bounds = K.measureBounds(skeleton, stageNS);
      if (!bounds && data.skins && data.skins.length) {
        // 部分 4.0 模型附件挂在皮肤上, 不设皮肤量不出包围盒
        const skin = data.skins.find(s => s.name === 'default') || data.skins[0];
        try { skeleton.setSkin(skin); skeleton.setSlotsToSetupPose(); state.apply(skeleton); K.updateWorldTransform(skeleton); } catch {}
        bounds = K.measureBounds(skeleton, stageNS);
      }
      if (!bounds) throw new Error('empty bounds');
      if (seq !== cutLoadSeq) { disposeAtlas(atlas); return; }
      cut = { variant: String(v.variant || idx), sourceVariant: v, skeleton, data, state, atlas, bounds, centerX: 0, centerY: 0, fitScale: 1, hiddenSlots: new Set(),
              pma: !!(atlas.pages && atlas.pages[0] && atlas.pages[0].pma) };
      window.__cutRef = () => cut;
      window.__boneDebug = () => ({ boneEditMode, editBoneName, boneDrag: boneDrag ? boneDrag.mode : null, poseLocked: !!poseLocked });
      restoreHidden();
      if (partsCtl) partsCtl.refresh();
      updatePartsBadge();
      animSel.value = def;
      animSel.onchange = () => {
        if (cut) {
          playAnimation(animSel.value);
          const lc = store.get('lastChar', {});
          lc.anim = animSel.value;
          store.set('lastChar', lc);
        }
      };
      if (animCtl) animCtl.refresh();
      playAnimation(def);
      if (fitMode) refit(); else set100();
      status((cur.name || cur.id) + ' · ' + data.animations.length + ' 动画 · ' + data.bones.length + ' 骨骼');
      syncUrl(def);
      K.history.push({
        k: routeSource + ':' + cur.id, src: routeSource,
        t: aliasOf(cur.id) || cur.name || cur.id, s: cur.name || cur.source || '',
        u: location.pathname + '?id=' + encodeURIComponent(cur.id),
      });
      playerReady(seq);
    } catch (e) {
      if (seq !== cutLoadSeq) return;
      status('加载失败: ' + e.message);
      playerPost('error', { code: 'asset-load-failed', message: e.message || String(e) });
      console.error(e);
    }
  }

  // ---------- GIF 导出 (当前动画, 离屏逐帧渲染) ----------
  $('#btnGif').onclick = async () => {
    if (!cut) { K.toast('没有可导出的模型', 'err'); return; }
    const animName = animSel.value;
    const anim = cut.data.animations.find(a => a.name === animName);
    if (!anim) { K.toast('动画不存在', 'err'); return; }
    const fps = 15;
    const dur = Math.max(anim.duration || 1, 0.1);
    const frames = Math.min(Math.ceil(dur * fps), 120);
    const dt = dur / frames;
    const sourceVariant = cut.sourceVariant;
    const hiddenSlots = new Set(cut.hiddenSlots);
    const exportName = cur.name || cur.id;
    const SP = K.getSpine(cur && cur.spineVersion);
    let exportAtlas = null;
    let exportGL = null;
    K.toast(`正在渲染 GIF: ${frames} 帧…`, 'info', 10000);
    try {
      const { GIFEncoder, quantize, applyPalette } = await import('../../common/vendor/gifenc.esm.js');
      const W = 640, H = 640;
      const cv2 = document.createElement('canvas');
      cv2.width = W; cv2.height = H;
      const raw2 = cv2.getContext('webgl', { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
      if (!raw2) throw new Error('离屏 WebGL 不可用');
      exportGL = raw2;
      const mgl2 = new SP.ManagedWebGLRenderingContext(raw2);
      const r2 = new SP.SceneRenderer(cv2, mgl2);
      if (SP.GLTexture) SP.GLTexture.DISABLE_UNPACK_PREMULTIPLIED_ALPHA_WEBGL = true;
      // WebGL textures belong to their context. Reparse with an atlas loaded
      // into the export context instead of reusing the stage's attachments.
      const base = '../' + sourceVariant.dir;
      const am2 = new SP.AssetManager(mgl2, base);
      exportAtlas = await new Promise((res, rej) => am2.loadTextureAtlas(sourceVariant.atlas, (p, a) => res(a), (p, e) => rej(new Error(e))));
      const resp = await fetch(base + encodeURIComponent(sourceVariant.skel));
      if (!resp.ok) throw new Error('skel ' + resp.status);
      const loader = new SP.AtlasAttachmentLoader(exportAtlas);
      const data2 = sourceVariant.format === 'json'
        ? new SP.SkeletonJson(loader).readSkeletonData(await resp.text())
        : new SP.SkeletonBinary(loader).readSkeletonData(new Uint8Array(await resp.arrayBuffer()));
      const sk2 = new SP.Skeleton(data2);
      const sd2 = new SP.AnimationStateData(data2);
      sd2.defaultMix = 0;
      const st2 = new SP.AnimationState(sd2);
      st2.setAnimation(0, animName, false);
      // 第一遍: 推进并求动画全程包围盒
      let bMinX = Infinity, bMinY = Infinity, bMaxX = -Infinity, bMaxY = -Infinity;
      for (let k = 0; k < frames; k++) {
        st2.getCurrent(0).trackTime = k * dt;
        st2.apply(sk2);
        K.updateWorldTransform(sk2);
        K.applyHiddenSlots(sk2, hiddenSlots);
        const b = K.measureBounds(sk2, SP);
        if (b) {
          bMinX = Math.min(bMinX, b.minX); bMaxX = Math.max(bMaxX, b.maxX);
          bMinY = Math.min(bMinY, b.minY); bMaxY = Math.max(bMaxY, b.maxY);
        }
      }
      if (!isFinite(bMinX)) throw new Error('空包围盒');
      const spanW = bMaxX - bMinX, spanH = bMaxY - bMinY;
      const scale = Math.min(W * 0.92 / spanW, H * 0.92 / spanH);
      const cx = -(bMinX + spanW / 2), cy = -(bMinY + spanH / 2);
      // 第二遍: 逐帧渲染
      st2.clearTracks();
      sk2.setToSetupPose();
      st2.setAnimation(0, animName, false);
      const cvRgb = document.createElement('canvas');
      cvRgb.width = W; cvRgb.height = H;
      const ctx2d = cvRgb.getContext('2d', { willReadFrequently: true });
      const gif = GIFEncoder();
      for (let k = 0; k < frames; k++) {
        st2.getCurrent(0).trackTime = k * dt;
        st2.apply(sk2);
        sk2.scaleX = scale; sk2.scaleY = scale;
        sk2.x = cx * scale; sk2.y = cy * scale;
        K.updateWorldTransform(sk2);
        K.applyHiddenSlots(sk2, hiddenSlots);
        r2.begin();
        raw2.clearColor(0, 0, 0, 0);
        raw2.clear(raw2.COLOR_BUFFER_BIT);
        r2.drawSkeleton(sk2, !!exportAtlas.pages[0]?.pma);
        r2.end();
        const img = new Image();
        await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('帧捕获失败')); img.src = cv2.toDataURL('image/png'); });
        ctx2d.clearRect(0, 0, W, H);
        ctx2d.drawImage(img, 0, 0);
        const rgba = ctx2d.getImageData(0, 0, W, H).data;
        const palette = quantize(rgba, 256, { format: 'rgba4444' });
        const index = applyPalette(rgba, palette, 'rgba4444');
        gif.writeFrame(index, W, H, { palette, delay: Math.max(Math.round(dt * 1000), 20), transparent: true });
      }
      gif.finish();
      const a = document.createElement('a');
      const blob = new Blob([gif.bytes()], { type: 'image/gif' });
      a.href = URL.createObjectURL(blob);
      a.download = (exportName + '_' + animName).replace(/[^\w.-]+/g, '_') + '.gif';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      K.toast('GIF 已导出 (' + frames + ' 帧)', 'ok');
    } catch (e) {
      console.error(e);
      K.toast('GIF 导出失败: ' + e.message, 'err');
    } finally {
      if (exportAtlas) disposeAtlas(exportAtlas);
      exportGL?.getExtension('WEBGL_lose_context')?.loseContext();
    }
  };

  // ---------- PNG 导出 ----------
  function exportFrame(transparent, mode, done) {
    if (!cut) { K.toast('没有可导出的模型', 'err'); return; }
    const bak = { fit: fitMode, scale: userScale, px: panX, py: panY };
    K.exportPNG({
      canvas: cv, scale: exportScale, transparent, copy: mode === 'copy',
      filename: routeSource + '-' + (cur.name || cur.id) + '.png',
      resize(kk) {
        K.syncRendererSize(cv, mgl, renderer);
        const base = bak.fit ? cut.fitScale : bak.scale;
        fitMode = false; userScale = base * kk; panX = bak.px * kk; panY = bak.py * kk;
        applyView();
      },
      draw(tr) {
        K.updateWorldTransform(cut.skeleton);
        const raw = mgl.gl || mgl;
        if (tr) raw.clearColor(0, 0, 0, 0);
        else {
          const c = K.parseColor(getBg() === 'checker' ? '#000000' : getBg(), [0.06, 0.07, 0.09]);
          raw.clearColor(c[0], c[1], c[2], tr ? 0 : 1);
        }
        raw.clear(raw.COLOR_BUFFER_BIT);
        renderer.begin();
        renderer.drawSkeleton(cut.skeleton, cut.pma);
        renderer.end();
      },
      restore() {
        fitMode = bak.fit; userScale = bak.scale; panX = bak.px; panY = bak.py;
        K.resizeCanvas(cv, renderer);
        applyView();
      },
    }).then(r => {
      if (mode === 'copy') K.toast('已复制到剪贴板: ' + r.w + '×' + r.h + 'px', 'ok');
      else K.toast('已导出 PNG: ' + r.w + '×' + r.h + 'px', 'ok');
      if (done) done();
    }).catch(e => {
      K.toast((mode === 'copy' ? '复制失败: ' : '导出失败: ') + e.message, 'err');
      console.error(e);
    });
  }

  // ---------- 平移/缩放/点选 ----------
  let down = null, moved = false;
  const isChrome = (t) => !!(t.closest && (t.closest('.playbar') || t.closest('.zoom-bar') || t.closest('.rail') || t.closest('.tool-strip') || t.closest('.top-pill') || t.closest('.status') || t.closest('.immersive-exit')));
  stage.addEventListener('contextmenu', (e) => {
    if (isChrome(e.target)) return;
    e.preventDefault();
    K.showMenu([
      { label: '复制 PNG 到剪贴板', fn: () => exportFrame(true, 'copy') },
      { label: '导出 PNG', fn: () => exportFrame(false, 'download') },
      { sep: true },

      { label: '资源库 (G)', fn: () => openGrid() },
      { sep: true },

    ], e.clientX, e.clientY);
  });
  stage.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || isChrome(e.target)) return;
    closePopups();
    hidePartPopup();
    // 骨骼编辑模式: 尝试拾取骨骼(优先末端=旋转, 本体=平移)
    if (boneEditMode && cut) {
      const hit = hitBoneAt(e.clientX, e.clientY);
      if (hit) {
        const [swx, swy] = wpt(e.clientX, e.clientY);
        editBoneName = hit.bone.data.name;
        if (!(editBoneName in editOrig)) {
          editOrig[editBoneName] = { rotation: hit.bone.rotation, x: hit.bone.x, y: hit.bone.y };
        }
        if (hit.mode === 'rotate') {
          boneDrag = { mode: 'rotate', boneName: editBoneName, ox: hit.bone.worldX, oy: hit.bone.worldY, startAngle: Math.atan2(swy - hit.bone.worldY, swx - hit.bone.worldX), startRot: hit.bone.rotation };
        } else {
          boneDrag = { mode: 'move', boneName: editBoneName, lastWX: swx, lastWY: swy };
        }
        try { stage.setPointerCapture(e.pointerId); } catch {}
        return;
      }
      editBoneName = null;
    }
    down = { x: e.clientX, y: e.clientY };
    moved = false;
    stage.classList.add('panning');
    try { stage.setPointerCapture(e.pointerId); } catch {}
  });
  stage.addEventListener('pointermove', (e) => {
    if (boneEditMode && cut && !boneDrag) {
      const hit = hitBoneAt(e.clientX, e.clientY);
      const nm = hit ? hit.bone.data.name : null;
      if (nm !== hoverBoneName) {
        hoverBoneName = nm;
        if (nm) status('骨骼: ' + nm + (hit.mode === 'rotate' ? ' · 拖末端旋转' : ' · 拖本体平移'));
      }
    }
    if (boneDrag && cut) {
      const [wx, wy] = wpt(e.clientX, e.clientY);
      const bone = cut.skeleton.findBone(boneDrag.boneName);
      if (!bone) { boneDrag = null; return; }
      if (boneDrag.mode === 'rotate') {
        const a = Math.atan2(wy - boneDrag.oy, wx - boneDrag.ox);
        bone.rotation = boneDrag.startRot + (a - boneDrag.startAngle) * 180 / Math.PI;
        status('骨骼 ' + boneDrag.boneName + ' · 旋转 ' + (bone.rotation - boneDrag.startRot).toFixed(1) + '° (右键恢复)');
      } else {
        const dx = wx - boneDrag.lastWX, dy = wy - boneDrag.lastWY;
        const pa = bone.parent ? bone.parent.a : 1, pb = bone.parent ? bone.parent.b : 0;
        const pc = bone.parent ? bone.parent.c : 0, pd = bone.parent ? bone.parent.d : 1;
        const det = pa * pd - pb * pc;
        if (det) { bone.x += (dx * pd - dy * pb) / det; bone.y += (dy * pa - dx * pc) / det; }
        boneDrag.lastWX = wx;
        boneDrag.lastWY = wy;
        status('骨骼 ' + boneDrag.boneName + ' · 位移 x ' + bone.x.toFixed(1) + ' y ' + bone.y.toFixed(1) + ' (右键恢复)');
      }
      K.updateWorldTransform(cut.skeleton);
      return;
    }
    if (!down || !cut) return;
    const dpr = devicePixelRatio || 1;
    if (Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 2) moved = true;
    if (!moved) return;
    panX += (e.clientX - down.x) * dpr;
    panY -= (e.clientY - down.y) * dpr;
    down = { x: e.clientX, y: e.clientY };
    if (fitMode) { fitMode = false; userScale = cut.fitScale; btn100.classList.add('active'); btnFit.classList.remove('active'); }
    applyView();
  });
  stage.addEventListener('contextmenu', (e) => {
    if (!boneEditMode || !cut) return;
    e.preventDefault();
    const hit = hitBoneAt(e.clientX, e.clientY);
    if (hit && (hit.bone.data.name in editOrig)) {
      const b = hit.bone, o = editOrig[hit.bone.data.name];
      b.rotation = o.rotation; b.x = o.x; b.y = o.y;
      K.updateWorldTransform(cut.skeleton);
      status('已恢复骨骼: ' + hit.bone.data.name);
    } else {
      const keys = Object.keys(editOrig);
      for (const k of keys) {
        const b = cut.skeleton.findBone(k);
        if (b) { b.rotation = editOrig[k].rotation; b.x = editOrig[k].x; b.y = editOrig[k].y; }
      }
      K.updateWorldTransform(cut.skeleton);
      status(keys.length ? '已恢复 ' + keys.length + ' 根骨骼' : '没有编辑过的骨骼');
    }
  });
  stage.addEventListener('pointerup', (e) => {
    if (boneDrag) { boneDrag = null; return; }
    if (down && e.pointerId !== undefined) { try { stage.releasePointerCapture(e.pointerId); } catch (err) {} }
    const wasTap = down && !moved && e.button === 0;
    const tapX = e.clientX, tapY = e.clientY;
    down = null;
    stage.classList.remove('panning');
    if (wasTap && cut && !isChrome(e.target)) {
      if (boneEditMode) {
        const hit = hitBoneAt(tapX, tapY);
        editBoneName = hit ? hit.bone.data.name : null;
        status(editBoneName ? '已选中骨骼: ' + editBoneName : '未选中骨骼(点击骨骼本体或末端)');
        return;
      }
      const rect = cv.getBoundingClientRect();
      const dpr = devicePixelRatio || 1;
      const name = K.hitTestSlot(cut.skeleton, (tapX - rect.left) * dpr - cv.width / 2, cv.height / 2 - (tapY - rect.top) * dpr, K.getSpine(cur && cur.spineVersion));
      if (name) showPartPopup(name, tapX, tapY);
      else hidePartPopup();
    }
  });
  stage.addEventListener('wheel', (e) => {
    if (e.target.closest('.playbar') || e.target.closest('.zoom-bar')) return;
    e.preventDefault();
    hidePartPopup();
    if (!cut) return;
    const rect = cv.getBoundingClientRect();
    const dpr = devicePixelRatio || 1;
    zoomBy(e.deltaY < 0 ? 1.1 : 0.9, (e.clientX - rect.left) * dpr - cv.width / 2, (e.clientY - rect.top) * dpr - cv.height / 2);
    btn100.classList.add('active'); btnFit.classList.remove('active');
  }, { passive: false });

  // ---------- 调试视图 ----------
  makeStagePopup(btnDebug, (pop) => {
    const flags = [
      ['bones', '骨骼线'], ['regions', '区域框'], ['bounds', '包围盒'],
      ['meshHull', '网格轮廓'], ['meshTris', '网格三角面'], ['paths', '路径'], ['clipping', '裁剪形状'],
    ];
    pop.innerHTML = '<div class="col">'
      + '<div class="col-title">调试视图(设置自动保存)</div>'
      + flags.map(([k, lbl]) => '<label><input type="checkbox" data-f="' + k + '"' + (debugFlags[k] ? ' checked' : '') + '> ' + lbl + '</label>').join('')
      + '</div>';
    pop.addEventListener('change', (e) => {
      const ch = e.target;
      if (ch.dataset && ch.dataset.f) {
        debugFlags[ch.dataset.f] = ch.checked;
        store.set('debugView', debugFlags);
      }
    });
  });

  // ---------- 快捷键 ----------
  K.bindKeys({
    ' ': () => pbPlay.click(),
    'l': () => pbLoop.click(), 'L': () => pbLoop.click(),
    'ArrowLeft': () => nav(-1),
    'ArrowRight': () => nav(1),
    ',': () => stepFrame(-1),
    '.': () => stepFrame(1),
    'f': () => btnFit.click(), 'F': () => btnFit.click(),
    'g': () => toggleGrid(), 'G': () => toggleGrid(),
    'e': () => btnBoneEdit.click(), 'E': () => btnBoneEdit.click(),
    'i': () => toggleImmersive(), 'I': () => toggleImmersive(),
    '+': () => zoomBy(1.2), '=': () => zoomBy(1.2),
    '-': () => zoomBy(0.8),
    's': () => cur && toggleStarById(cur.id), 'S': () => cur && toggleStarById(cur.id),
    '?': () => K.showShortcuts('快捷键速查', [
      ['空格', '播放 / 暂停'], ['L', '循环'], [', / .', '后退 / 前进 1 帧'],
      ['← / →', '切换资源'], ['G', '资源库 / 舞台'], ['I', '沉浸模式'],
      ['E', '骨骼编辑模式'], ['F', '适应窗口'], ['+ / -', '缩放'], ['S', '收藏'], ['Esc', '关闭弹窗'],
      ['↔ / 按钮', '原版对比 (Mod 分类)'], ['🎞 按钮', '导出当前动画 GIF'], ['Ctrl+K', '全局搜索'],
    ]),
    'Escape': () => { closePopups(); hidePartPopup(); },
  });

  // ---------- 启动 ----------
  window.onerror = (msg) => { status('脚本错误: ' + msg); };
  window.onunhandledrejection = (e) => { status('异步错误: ' + (e.reason && e.reason.message || e.reason)); };
  // 多版本运行时: 静态脚本已载入 4.1, 这里再捕获并补载 4.0/4.2
  (async () => {
    setupDesktopBridge();
    K.initSearchPalette();
    K.captureSpine('4.1');
    await K.loadSpineVersion('4.0', ['vendor/spine-webgl-4.0.js']);
    await K.loadSpineVersion('4.2', ['vendor/spine-webgl-4.2.js']);
    // bd2mod 分类: 预载原版索引供"⇋ 原版对比"配对
    if (routeSource === 'bd2mod') {
      fetch('../../bd2/bd2_chars.json').then(r => (r.ok ? r.json() : null)).then(d => {
        if (!d || !d.characters) return;
        origByNum = {};
        for (const o of d.characters) origByNum[o.id] = o;
        updateCompareBtn();
      }).catch(() => {});
    }
    loadChars().catch(e => status('数据加载失败: ' + e.message));
  })();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
