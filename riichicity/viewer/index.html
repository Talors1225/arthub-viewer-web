<!doctype html>
<html data-site-ui="1" data-catalog="riichicity" lang="zh-CN" data-accent="gold" data-gav-ui="clean">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻雀一番街 · ArtHub</title>
<link rel="stylesheet" href="../../common/kit.css?v=20261104-unified-final">
<link rel="stylesheet" href="../../common/stage-ui.css?v=20261104-unified-final">
<link rel="stylesheet" href="../../common/library-ui.css?v=20261104-unified-final">
<link rel="stylesheet" href="../../common/visual.css?v=20261104-unified-final">
<link rel="stylesheet" href="../../common/interaction-viewer-shell.css?v=20261104-unified-final">
<link rel="stylesheet" href="./local.css?v=20261104-unified-final"><link rel="stylesheet" href="catalog.css?v=20261104-unified-final">
<link rel="stylesheet" href="../../crosscore-interaction/viewer/crosscore-interaction-ui.css?v=20261104-unified-final"><link rel="stylesheet" href="../../common/site-ui.css?v=20261104-unified-final"><script defer src="../../common/site-ui.js?v=20261104-unified-final"></script>
<script src="../../arthub-cos-config.js?v=20261104-unified-final"></script><script src="../../arthub-cos.js?v=20261104-unified-final"></script></head>
<body class="game-interaction-viewer crosscore-interaction-viewer local-mod-viewer riichicity-viewer">
  <main class="stage" id="stage" aria-label="麻雀一番街立绘舞台">
    <canvas id="canvas"></canvas>
    <div id="riichiSubtitle" class="riichi-subtitle" role="status" hidden></div>

    <div class="status" id="status" role="status">请选择角色与皮肤</div>
    <div class="hint" id="touch-hint"></div>
  </main>

  <nav class="rail" id="rail" aria-label="ArtHub 查看器导航">
    <button id="railGrid" type="button" title="资源库 (G)" aria-label="资源库 (G)"></button>
    <span class="rail-sep"></span>
    <button id="btnPrev" type="button" title="上一个 (←)" aria-label="上一个 (←)"></button>
    <button id="btnNext" type="button" title="下一个 (→)" aria-label="下一个 (→)"></button>
    <button id="railThumb" class="rail-thumb" type="button" title="适应窗口 (F)" aria-label="适应窗口 (F)"><span>预览暂缺</span></button>
    <span class="rail-sep"></span>
    <button id="homeAction" type="button" title="网站首页" aria-label="网站首页" data-action-label="首页"></button>
  </nav>



  <div id="toolStrip" class="tool-strip" aria-label="舞台工具">
    <div class="zoom-bar tool-zoom" aria-label="视图缩放">
      <button id="zOut" type="button" title="缩小" aria-label="缩小" disabled></button>
      <button id="zPct" class="zoom-pct" type="button" title="适应窗口" aria-label="适应窗口" disabled>100%</button>
      <button id="zIn" type="button" title="放大" aria-label="放大" disabled></button>
    </div>
    <button id="btnAnimTab" type="button" title="动画、互动与声音" aria-label="动画、互动与声音" aria-expanded="false"></button>
    <button id="btnStagePan" type="button" title="拖动画面" aria-label="拖动画面" aria-pressed="true"></button>
    <button id="fit" type="button" title="适应窗口" hidden>适应</button>
  </div>

  <footer class="playbar collapsed" id="playbar" aria-label="播放控制">
    <button id="playbarToggle" class="playbar-toggle" type="button" aria-expanded="false" title="展开播放控制"></button>
    <div class="playbar-controls">
      <button id="pbPlay" class="ctl active" type="button" title="暂停" aria-label="暂停"></button>
      <button id="pbStepB" class="ctl" type="button" title="后退 1 帧" aria-label="后退 1 帧">«</button>
      <input id="pbRange" type="range" min="0" max="1000" value="0" aria-label="动画进度">
      <button id="pbStepF" class="ctl" type="button" title="前进 1 帧" aria-label="前进 1 帧">»</button>
      <span class="pb-time" id="pbTime">0.00 / 0.00s</span>
      <button id="pbLoop" class="ctl active" type="button" title="循环" aria-label="循环" aria-pressed="true"></button>
      <input id="pbSpeed" class="pb-speed" type="range" min="0.05" max="3" step="0.05" value="1" title="播放速度" aria-label="播放速度">
      <span class="pb-speed-val" id="pbSpeedVal">1x</span>
    </div>
  </footer>

  <div class="viewer-legacy-controls" hidden aria-hidden="true">
    <button id="btnRetry" type="button">重试当前立绘</button><select id="animation" disabled></select><button id="play" type="button" disabled>暂停</button><input type="checkbox" id="loop" checked>
    <select id="speed"><option value="1" selected>1</option></select>
  </div>

  <section id="gridView" class="open library-ui" aria-label="麻雀一番街角色与皮肤">
 <div class="grid-head">
  <a class="kit-home-action" href="../../index.html" aria-label="返回 ArtHub 首页"></a><span class="grid-title">资源库</span><span class="grid-sub" id="catalogSummary">麻雀一番街 · 正在读取目录…</span>
  <div id="filterChips" aria-label="资源分类"><button id="allCharacters" hidden class="filter-chip" data-catalog-tab="characters">全部角色</button><button id="allSkins" class="filter-chip on" data-catalog-tab="skins">全部立绘</button><button id="favorites" class="filter-chip library-favorites" data-catalog-tab="favorites">☆ 收藏 <span class="n">0</span></button><select id="characterSelect" class="kit-facet-select" aria-label="选择角色"><option>正在加载…</option></select><select id="catalogSort" class="sort-sel" aria-label="资源排序方式"><option value="default">默认顺序</option><option value="name">名称</option></select><button id="catalogSortDir" class="sort-dir-toggle" aria-label="切换排序方向">升序</button></div>
  <input id="gridSearch" class="kit-grid-search text-input" type="search" placeholder="搜索角色 / 皮肤 / 编号" aria-label="搜索角色或皮肤"><button id="btnTheme" class="edit-btn" title="主题调色板" aria-label="主题调色板"></button><a id="localSponsor" class="grid-sponsor" href="https://afdian.com/a/talors" target="_blank" rel="noopener noreferrer">爱发电</a><button id="gridClose" class="ctl" hidden>返回舞台</button>
 </div>
 <div class="catalog-feedback">
  <p id="importStatus" class="mod-status" role="status" aria-live="polite">正在读取资源目录…</p>
  <div id="importBusy" class="catalog-loading" hidden><span class="stage-loading-spinner" aria-hidden="true"></span><span>正在读取资源目录…</span></div>
  <button id="catalogRetry" class="edit-btn" type="button" hidden>重新读取目录</button><button id="cancelLoad" type="button" hidden>取消加载</button>
  <details id="issuesBox" hidden><summary>播放提示</summary><ul id="issuesList"></ul></details>
 </div>
  <div id="modelSection" hidden></div><span id="catalogHeading" hidden>全部角色</span><div id="thumbGrid" class="thumb-grid"></div><p id="catalogEmpty" class="catalog-empty" hidden>没有找到匹配的角色或皮肤</p><nav id="gridPagination" class="grid-pagination" aria-label="资源库分页"></nav>
  <div hidden><div id="dropZone"><button id="chooseFolder"></button><button id="chooseFiles"></button><input id="folderInput" type="file" webkitdirectory multiple><input id="filesInput" type="file" multiple></div><button id="clearFiles"></button></div>
</section>
  <aside id="floatPanel" aria-label="立绘互动面板">
    <div class="rp-panel-head">
      <div class="rp-tabs" role="tablist" aria-label="互动面板分类">
        <button class="on" type="button" data-panel-tab="anim" aria-selected="true">动画</button>
        <button type="button" data-panel-tab="voice" aria-selected="false">声音</button>
      </div>
      <button class="rp-panel-close" id="panel-close" type="button" title="关闭面板" aria-label="关闭面板">×</button>
    </div>
        <div class="rp-page on" data-panel-page="anim">
      <label id="skinRow" class="mod-skin" hidden>表情<select id="skinSelect" aria-label="切换表情"></select></label><div class="row"><input id="animFilter" class="text-input" type="search" placeholder="过滤动画名" aria-label="过滤动画名"></div>
      <div id="animList" class="anim-list"></div>
    </div>
    <div class="rp-page" data-panel-page="voice"><div class="riichi-voice-panel">
      <p id="voiceScope" class="muted">选择立绘后显示对应角色与皮肤语音。</p>
      <label><input id="voiceInteractive" type="checkbox" checked> 点击立绘时播放游戏互动语音</label>
      <label id="voiceFormRow" hidden>语音形态<select id="voiceForm" aria-label="语音形态"></select></label>
      <label for="voiceGroup">语音来源</label><select id="voiceGroup" aria-label="语音来源"></select>
      <input id="voiceSearch" class="text-input" type="search" placeholder="搜索语音名称或编号" aria-label="搜索语音">
      <label for="voiceSelect">选择语音</label><select id="voiceSelect" aria-label="选择语音"></select>
      <div class="voice-actions"><button id="voicePlay" type="button" disabled>播放</button><button id="voiceStop" type="button" disabled>停止</button></div>
      <label for="voiceVolume">音量</label><input id="voiceVolume" type="range" min="0" max="100" value="80" aria-label="语音音量">
      <p id="voiceStatus" role="status">选择立绘后显示语音。</p><audio id="riichiVoiceAudio" preload="none" hidden></audio>
    </div></div>
  </aside>

  <script src="../../common/asset-display-overrides.js?v=20261104-unified-final"></script>
  <script src="../../common/kit.js?v=20261114-interaction-export-loading"></script>
  <script src="../../common/asset-loader.js?v=20261104-unified-final"></script>
  <script src="../../common/stage-ui.js?v=93a59d25328a"></script><script src="../../common/library-ui.js?v=20261104-unified-final"></script>
  <script src="../../common/interaction-viewer-tools.js?v=20261114-interaction-export-loading"></script>
  <script src="../../common/interaction-viewer-ui.js?v=20261114-interaction-export-loading"></script>
  <script type="module" src="./viewer.mjs?v=20261114-interaction-export-loading"></script>
</body>
</html>
